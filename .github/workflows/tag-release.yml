name: Tag Release

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'

jobs:
  tag-release:
    name: "Tag Git Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Create and push git release tag
        run: |
          APP_VERSION=$(tr -d '[:space:]' < VERSION)
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$APP_VERSION"; then
            echo "::error::VERSION does not contain a valid SemVer string: $APP_VERSION"
            exit 1
          fi
          TAG="v${APP_VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on git repository, skipping tag creation."
          else
            echo "Creating new git release tag: $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
