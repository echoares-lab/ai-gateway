name: SBOM

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SBOM generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install cyclonedx-bom
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py requirements -i requirements/ci-runner-venv.txt --output-format JSON --output-file ai-gateway-python.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-gateway-sbom
          path: ai-gateway-python.cdx.json
