name: Nightly Integration

# Gate C — scheduled real-provider smoke + full integration matrix (report-only).
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: nightly-integration
  cancel-in-progress: false

jobs:
  real-provider-smoke:
    runs-on: arc-dind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Docker Compose v2
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE_VERSION=v2.27.0
          case "$(uname -m)" in
            x86_64)
              COMPOSE_ARCH=x86_64
              COMPOSE_SHA256=f3ba3bf1e4ab18e96c2d36526a075a02a78fb5f8e80d3e3ca9c5bf256d81d0a0
              ;;
            aarch64|arm64)
              COMPOSE_ARCH=aarch64
              COMPOSE_SHA256=37a1c197fef5fda2a3df2d5ae0d7762ad2a00e30946ad06d4ad9fa8cef16d9e7
              ;;
            *)
              echo "Unsupported Docker Compose architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          COMPOSE_DIR="${HOME}/.docker/cli-plugins"
          COMPOSE_BIN="${COMPOSE_DIR}/docker-compose"
          mkdir -p "$COMPOSE_DIR"
          COMPOSE_TMP="$(mktemp "${COMPOSE_DIR}/docker-compose.XXXXXX")"
          trap 'rm -f "$COMPOSE_TMP"' EXIT
          curl --fail --location --retry 3 --show-error \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-${COMPOSE_ARCH}" \
            --output "$COMPOSE_TMP"
          printf '%s  %s\n' "$COMPOSE_SHA256" "$COMPOSE_TMP" | sha256sum --check --strict
          chmod +x "$COMPOSE_TMP"
          mv -f "$COMPOSE_TMP" "$COMPOSE_BIN"
          docker compose version --short | grep -Fx "${COMPOSE_VERSION#v}"
          echo "NIGHTLY_COMPOSE_READY=true" >> "$GITHUB_ENV"
      - name: Mask injected CI secrets
        run: |
          [ -n "${CLIPROXY_AUTH_TAR_B64:-}" ] && echo "::add-mask::$CLIPROXY_AUTH_TAR_B64" || true
      - name: Log in to Nexus registry
        run: echo "$NEXUS_PASSWORD" | docker login nexus-docker.infra.plexplease.com -u "$NEXUS_USERNAME" --password-stdin
      - uses: ./.github/actions/setup-python-venv
        with:
          requirements-files: |
            requirements/ci-runner-venv.txt
            tests/integration/requirements.txt
      - name: Add CI venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Setup environment file
        run: cp .env.example .env
      - name: Seed real OAuth creds
        run: |
          mkdir -p "$HOME/.cli-proxy-api"
          if [ -n "${CLIPROXY_AUTH_TAR_B64:-}" ]; then
            echo "$CLIPROXY_AUTH_TAR_B64" | base64 -d | tar -xz -C "$HOME/.cli-proxy-api"
            echo "✓ seeded OAuth creds"
          else
            echo "::warning::No CLIPROXY_AUTH_TAR_B64 in runner env; tests will skip."
          fi
      - name: Build and start gateway stack
        run: |
          # cliproxy is pulled from Nexus (echoares-lab fork image).
          export CLIPROXY_DEV_CONFIG="$PWD/tests/cliproxy-config-ci.yaml"
          ./dev-env.sh start 1
      - name: Wait for gateway-engine
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:4010/health >/dev/null && exit 0
            sleep 3
          done
          exit 1
      - name: Run smoke subset (Gate C)
        run: |
          ./dev-env.sh test 1 -m "integration and smoke"
      - name: Run full integration matrix
        continue-on-error: true
        run: |
          ./dev-env.sh test 1 -m integration
      - name: Stop services
        if: always()
        run: |
          if [[ "${NIGHTLY_COMPOSE_READY:-}" == "true" ]]; then
            docker compose -f docker-compose.dev.yml -p aidev1 logs || true
            ./dev-env.sh stop 1
          else
            echo "Docker Compose setup did not complete; skipping logs and teardown." >&2
          fi
