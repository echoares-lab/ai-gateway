name: Hotspot E2E Reminder

# Suggests opt-in Gate C (run-e2e label) when a PR touches high-risk paths.
# Gate C is not required for merge pending e2e refactor.
on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]

concurrency:
  group: hotspot-e2e-reminder-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  hotspot-check:
    name: "Reminder :: Hotspot Check"
    # Lightweight comment bot — avoid self-hosted queue behind Docker CI jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            hotspot:
              - 'services/gateway-engine/**'
              - 'litellm-config.yaml'
              - 'docker-compose*.yml'
              - 'Dockerfile*'
              - 'cliproxy-setup.sh'
              - 'dev-env.sh'
      - name: Remind to run Gate C (opt-in)
        if: steps.filter.outputs.hotspot == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const marker = '<!-- hotspot-e2e-reminder -->';
            const body = `${marker}
            ### Gate C recommended (high-risk paths changed)

            This PR touches auth/routing/provider/config hotspots. Gate C is **opt-in** (not required to merge) pending an e2e refactor. Before merge, consider:

            - Add the \`run-e2e\` label to trigger CI \`real-provider-e2e\`, or
            - Run \`make test-e2e\` locally against a dev slot

            See \`docs/TESTING.md\` and \`REPO_IMPROVEMENT_APPENDIX.md\`.
            `;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
