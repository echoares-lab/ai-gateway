name: Staging Deep Smoke

# Reusable / on-demand staging promote-gate smoke.
# Runs ./scripts/ops/deep-smoke.sh --env staging --full against live staging.
#
# Required repository secrets (fail closed if missing):
#   DEEP_SMOKE_STAGING_API_KEY  — bearer for /v1 (dedicated staging smoke key)
#   K3S_KUBECONFIG              — kubeconfig with access to ai-gateway-staging
#                                 and the platform Postgres namespace used for
#                                 LiteLLM_SpendLogs (usually `database`)
# Optional:
#   DEEP_SMOKE_STAGING_ADMIN_KEY — x-admin-key for /admin/* when admin read auth
#                                  is enabled on staging
#
# Called by promote-k3s-images.yml before opening a prod digest-pin PR (#410).

on:
  workflow_call:
    inputs:
      expect_git_sha:
        description: "Require staging GET /version git_sha to match (full or prefix)"
        required: false
        type: string
        default: ""
      gateway_url:
        description: "Override staging gateway URL"
        required: false
        type: string
        default: ""
    outputs:
      summary:
        description: "Markdown summary from deep-smoke"
        value: ${{ jobs.deep-smoke.outputs.summary }}
  workflow_dispatch:
    inputs:
      expect_git_sha:
        description: "Require staging GET /version git_sha to match (full or prefix)"
        required: false
        type: string
        default: ""
      gateway_url:
        description: "Override staging gateway URL"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  deep-smoke:
    runs-on: arc
    outputs:
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require secrets
        env:
          API_KEY: ${{ secrets.DEEP_SMOKE_STAGING_API_KEY }}
          KUBECONFIG_DATA: ${{ secrets.K3S_KUBECONFIG }}
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${API_KEY}" ]]; then
            echo "::error::Missing secret DEEP_SMOKE_STAGING_API_KEY (staging smoke bearer key)."
            missing=1
          fi
          if [[ -z "${KUBECONFIG_DATA}" ]]; then
            echo "::error::Missing secret K3S_KUBECONFIG (kubeconfig for staging + SpendLogs Postgres access)."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Staging deep-smoke cannot run without secrets — failing closed (issue #410)."
            exit 1
          fi

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.34.1

      - name: Write kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.K3S_KUBECONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBECONFIG_DATA" | grep -q 'apiVersion:'; then
            printf '%s' "$KUBECONFIG_DATA" >"$HOME/.kube/config"
          else
            printf '%s' "$KUBECONFIG_DATA" | base64 -d >"$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context
          kubectl -n ai-gateway-staging get ns >/dev/null

      - name: Run staging deep-smoke --full
        id: run
        env:
          DEEP_SMOKE_API_KEY: ${{ secrets.DEEP_SMOKE_STAGING_API_KEY }}
          DEEP_SMOKE_ADMIN_KEY: ${{ secrets.DEEP_SMOKE_STAGING_ADMIN_KEY }}
          DEEP_SMOKE_GATEWAY_URL: ${{ inputs.gateway_url }}
          DEEP_SMOKE_EXPECT_GIT_SHA: ${{ inputs.expect_git_sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/ops/deep-smoke.sh
          set +e
          ./scripts/ops/deep-smoke.sh --env staging --full | tee /tmp/deep-smoke-summary.md
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "## Staging deep-smoke --full"
            echo
            echo "expect_git_sha: \`${DEEP_SMOKE_EXPECT_GIT_SHA:-none}\`"
            echo
            cat /tmp/deep-smoke-summary.md
          } >> "$GITHUB_STEP_SUMMARY"
          # multiline output for callers (promote PR body)
          {
            echo "summary<<EOF"
            cat /tmp/deep-smoke-summary.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$rc"
