name: policy-check

# SELF-CONTAINED variant of the Master-Policy gates.
#
# Most repos call echoares-lab/homelab-policies/.github/workflows/
# reusable-homelab-policy-check.yml. This repo cannot: GitHub does not allow a
# public repository (or a repository under a different owner) to call a
# reusable workflow hosted in a private one.
#
# GENERATED by homelab-policies/tooling/scripts/render-standalone-policy-check.py
# from that reusable workflow. Do not hand-edit — regenerate instead.
#
# The gates run the real scripts from a checkout of homelab-policies, made with a
# 60-minute token minted from the GitHub App `echoares-policy-reader` (E2.T3 /
# E7.T43). This repository therefore carries the Actions variable
# POLICY_APP_ID and the Actions secret POLICY_APP_PRIVATE_KEY; a public repo can
# check a private one out with the App token directly, it just cannot CALL a
# reusable workflow hosted there.

on:
  workflow_dispatch:
  push:
    branches: [main, master, production]
  pull_request:

jobs:
  policy:
    name: Master-Policy gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The §1.6 baseline ratchet diffs the baseline against the PR base
          # commit, which a depth-1 checkout does not contain.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # ── Gate 1: RETIRED 2026-08-14 (CICD-Policy §1.1.1) ────────────────────
      # MCP servers are configured once at user scope in ~/.claude.json, so no
      # repository carries a .mcp.json or .mcp.json.example and there is nothing
      # in a checkout to verify. Enforcing a repo-local file never delivered its
      # guarantee anyway: MCP resolves from the session's startup directory, so
      # the file only applied when a session happened to start in that repo.
      # See Master-Policy §1.5. Re-introducing a .mcp.json is blocked by the
      # pre-commit hook instead.

      # ── Gate 3: Secret scanning (CICD-Policy §1.1.3, Secrets-Policy §7) ─────
      # Runs BEFORE the policy tooling is checked out, so the scan covers the
      # caller's tree and nothing else.
      - name: "Gate 3 — install gitleaks (pinned)"
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks

      - name: "Gate 3 — secret scan"
        run: |
          CONFIG_ARG=""
          [ -f .gitleaks.toml ] && CONFIG_ARG="--config .gitleaks.toml"
          /tmp/gitleaks dir $CONFIG_ARG --no-banner --redact .

      # ── Policy tooling: the real scripts, from a real checkout ──────────────
      # The installation token is scoped by the App's installation (homelab-policies
      # only, Contents: read) and expires after 60 minutes; the action registers
      # it as a masked secret for the rest of the job. create-github-app-token
      # is pinned by commit SHA, not tag (CICD-Policy supply-chain rule).
      - name: "Policy tooling — mint a read token (GitHub App echoares-policy-reader)"
        id: policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.POLICY_APP_ID }}
          private-key: ${{ secrets.POLICY_APP_PRIVATE_KEY }}
          owner: echoares-lab
          repositories: homelab-policies

      - name: "Policy tooling — checkout echoares-lab/homelab-policies@master"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: echoares-lab/homelab-policies
          ref: master
          token: ${{ steps.policy-token.outputs.token }}
          path: .policy-tooling
          # The token is not needed after the clone and must not survive in
          # .git/config for a later step to find.
          persist-credentials: false

      # actions/checkout can only write inside $GITHUB_WORKSPACE, which is the
      # caller's tree -- and the container-notice gate below walks that tree
      # with `find`. The tooling is moved out so no gate can ever count
      # homelab-policies' own files as the caller's.
      - name: "Policy tooling — move out of the caller's tree"
        run: |
          mv "$GITHUB_WORKSPACE/.policy-tooling" "$RUNNER_TEMP/homelab-policies"
          echo "POLICY_TOOLING=$RUNNER_TEMP/homelab-policies" >> "$GITHUB_ENV"
          echo "policy tooling: $(git -C "$RUNNER_TEMP/homelab-policies" rev-parse HEAD) (echoares-lab/homelab-policies@master)"
          pip install --quiet pyyaml

      # ── §1.6 Documentation minimalism ───────────────────────────────────────
      - name: "Gate — documentation minimalism (§1.6)"
        run: |
          ARGS=""
          false && ARGS="--exempt-vendored"
          python3 "$POLICY_TOOLING/tooling/scripts/check-doc-minimalism.py" . $ARGS

      # ── §1.6 exception ratchet ──────────────────────────────────────────────
      # The gate above only blocks markdown that is NOT covered by a live entry in
      # homelab-policies/policy/exceptions.yaml. Without this step an exception is
      # permanent amnesty: green forever while the debt never shrinks. This step
      # enforces that the exception is dated, that its scope cannot grow, that it
      # self-cleans as files are migrated, and that its `shrink_to` checkpoints
      # are met. Same checker as the gate above — no second copy to drift.
      #
      # The store is read from $POLICY_TOOLING (the App-token checkout of
      # homelab-policies above), so a repository carries no exception file of its
      # own. Replaced the per-repo .doc-minimalism-baseline files 2026-08-23.
      - name: "Gate — documentation minimalism exception ratchet (§1.6)"
        env:
          # On pull_request the base commit is the ratchet reference; on push
          # there is none and the checker falls back to HEAD. The growth arm is
          # a no-op here either way -- $POLICY_TOOLING is a fresh clone of
          # homelab-policies' default branch -- because growth is caught in the
          # homelab-policies PR that causes it, where it is actionable. Expiry,
          # self-clean and the burn-down schedule are enforced fully.
          DOC_MINIMALISM_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ARGS=""
          false && ARGS="--exempt-vendored"
          python3 "$POLICY_TOOLING/tooling/scripts/check-doc-minimalism.py" . --ratchet $ARGS

      # ── Licensing-Policy §3: container builds carry the notices they owe ────
      #
      # E7.T26. A container image is a redistribution, so when a build here bakes
      # upstream code into an image and pushes it, the licence's notice condition
      # binds US. A grep for licence/notice/copyright across every Dockerfile in
      # the fleet returned ZERO matches while two of those builds were shipping
      # upstream MIT code to Nexus.
      #
      # Skipped entirely when the caller has no Dockerfile, so repos that build no
      # images pay nothing. The checker reads its base-image classification from
      # the same checkout (policy/container-notice-policy.yaml) -- the config is
      # not optional decoration: without it the check classifies nothing and
      # passes everything.
      - name: "Gate — container notice obligations (Licensing-Policy §3)"
        run: |
          if ! find . -path ./.git -prune -o \
                 \( -name 'Dockerfile' -o -name 'Dockerfile.*' -o -name '*.Dockerfile' \
                    -o -name 'Containerfile' \) -print | grep -q .; then
            echo "no Dockerfile in this repository - nothing to check"
            exit 0
          fi
          python3 "$POLICY_TOOLING/tooling/scripts/check-container-notices.py" . \
            --config "$POLICY_TOOLING/policy/container-notice-policy.yaml"

      # ── AGENTS.md provenance ────────────────────────────────────────────────
      # Full drift detection needs the vault, which GitHub-hosted runners cannot
      # reach (private repo, no token wired up). Local pre-commit runs the real
      # `render-agents-md.py --check`. CI verifies the weaker invariant: that the
      # file is still generated and nobody replaced it with a hand-written copy.
      - name: "Gate — AGENTS.md is generated"
        run: |
          if [ ! -f AGENTS.md ]; then
            echo "::error::AGENTS.md is missing. Generate it: render-agents-md.py --repo . --profile <profile>"
            exit 1
          fi
          if ! grep -q "BEGIN GENERATED" AGENTS.md || ! grep -q "END GENERATED" AGENTS.md; then
            echo "::error::AGENTS.md has lost its generation markers — it was hand-edited or replaced."
            echo "::error::Regenerate from the vault: render-agents-md.py --repo . --profile <profile>"
            exit 1
          fi
          echo "ok: AGENTS.md carries generation markers"
