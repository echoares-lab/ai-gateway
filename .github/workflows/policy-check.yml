name: policy-check

# SELF-CONTAINED variant of the Master-Policy gates.
#
# Most repos call echoares-lab/dev-policies/.github/workflows/
# reusable-homelab-policy-check.yml. This repo cannot: GitHub does not allow a
# public repository (or a repository under a different owner) to call a
# reusable workflow hosted in a private one.
#
# GENERATED by dev-policies/tooling/scripts/render-standalone-policy-check.py
# from that reusable workflow. Do not hand-edit — regenerate instead.

on:
  workflow_dispatch:
  push:
    branches: [main, master, production]
  pull_request:

jobs:
  policy:
    name: Master-Policy gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Gate 1: RETIRED 2026-08-14 (CICD-Policy §1.1.1) ────────────────────
      # MCP servers are configured once at user scope in ~/.claude.json, so no
      # repository carries a .mcp.json or .mcp.json.example and there is nothing
      # in a checkout to verify. Enforcing a repo-local file never delivered its
      # guarantee anyway: MCP resolves from the session's startup directory, so
      # the file only applied when a session happened to start in that repo.
      # See Master-Policy §1.5. Re-introducing a .mcp.json is blocked by the
      # pre-commit hook instead.

      # ── Gate 3: Secret scanning (CICD-Policy §1.1.3, Secrets-Policy §7) ─────
      - name: "Gate 3 — install gitleaks (pinned)"
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks

      - name: "Gate 3 — secret scan"
        run: |
          CONFIG_ARG=""
          [ -f .gitleaks.toml ] && CONFIG_ARG="--config .gitleaks.toml"
          /tmp/gitleaks dir $CONFIG_ARG --no-banner --redact .

      # ── §1.6 Documentation minimalism ───────────────────────────────────────
      # The checker is INLINED rather than checked out: dev-policies is private,
      # and a caller's GITHUB_TOKEN cannot read another private repo. Inlining
      # avoids requiring a PAT secret in all 13 repos.
      #
      # This block is GENERATED from tooling/scripts/check-doc-minimalism.py by
      # tooling/scripts/sync-workflow-inline.py. Do not edit it here — edit the
      # script and re-run the sync. dev-policies CI fails if the two diverge.
      - name: "Gate — documentation minimalism (§1.6)"
        run: |
          ARGS=""
          false && ARGS="--exempt-vendored"
          cat > /tmp/check-doc-minimalism.py <<'CHECKER_EOF'
          #!/usr/bin/env python3
          """
          check-doc-minimalism.py — CI gate for Master-Policy §1.6

          Scans a repository's *tracked* markdown and fails when a file is outside the
          §1.6 permitted list. This is the CI backstop for the same rule the PreToolUse
          hook (tooling/hooks/block-prohibited-docs.py) enforces at write time — the hook
          catches an agent, this catches a human, a merge, or a session with hooks off.

          The permitted list is kept in ONE place — PERMITTED_BASENAMES below, imported by
          the hook — so the two enforcement points cannot drift apart.

          Usage:
            check-doc-minimalism.py [repo_path] [--exempt-vendored]

          Exit 0 = compliant, 1 = violations found.
          """

          import argparse
          import re
          import subprocess
          import sys
          from pathlib import Path

          # ── The §1.6 permitted list (exhaustive), plus the 2026-08-12 amendments ──────
          PERMITTED_BASENAMES = {
              "README.md", "AGENTS.md", "CLAUDE.md", "GEMINI.md",
              "LICENSE", "LICENSE.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md",
              "TOOLING.md",
          }

          # Paths permitted regardless of basename.
          PERMITTED_PATTERNS = [
              r"^\.github/",                       # GitHub-convention files
              r"(^|/)docs/openapi/",               # served by docs-server — interface artifact
              r"(^|/)docs/runbooks?/",             # alert runbook_url targets — interface artifact
              r"(^|/)testdata/", r"(^|/)fixtures/",  # test fixtures
              r"(^|/)node_modules/", r"(^|/)vendor/", r"(^|/)\.worktrees/",
          ]

          # dev-policies' kit content is its product (Policy-Kit-Boundary), NOT status logs.
          DEVPOLICIES_PRODUCT = (
              r"^(policies|overlays|profiles|adr|repo-pack|schemas|tooling|docs/policy-"
              r"|VERSIONING\.md$|policy-index\.md$)"
          )

          VENDORED = {"CLIProxyAPI", "Cli-Proxy-API-Management-Center"}


          def is_policy_kit(repo: Path) -> bool:
              """Identify dev-policies by its CONTENT, not its directory name.

              Directory name is not a reliable identity: a git worktree is named after the
              branch, and `hardware`'s checkout directory does not match its repo name
              (`server-partpicker`). Name-based detection silently dropped the kit's
              product exemption and reported 91 false violations inside a worktree.
              """
              return (repo / "schemas" / "policy.schema.json").is_file() and (repo / "policies" / "baseline").is_dir()


          def tracked_markdown(repo: Path):
              try:
                  out = subprocess.run(["git", "-C", str(repo), "ls-files", "*.md", "*.markdown"],
                                       capture_output=True, text=True, check=True).stdout
              except subprocess.CalledProcessError:
                  return []
              return [l for l in out.splitlines() if l.strip()]


          def is_permitted(is_kit: bool, rel: str) -> bool:
              if Path(rel).name in PERMITTED_BASENAMES:
                  return True
              for pat in PERMITTED_PATTERNS:
                  if re.search(pat, rel):
                      return True
              if is_kit and re.match(DEVPOLICIES_PRODUCT, rel):
                  return True
              # Format notes adjacent to the artifacts they describe: a README.md inside a
              # data/asset directory is explicitly allowed by §1.6.
              if Path(rel).name == "README.md":
                  return True
              return False


          BASELINE_NAME = ".doc-minimalism-baseline"


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("repo", nargs="?", default=".", type=Path)
              ap.add_argument("--exempt-vendored", action="store_true")
              ap.add_argument("--write-baseline", action="store_true",
                              help="record current violations as the accepted backlog")
              args = ap.parse_args()

              repo = args.repo.resolve()
              name = repo.name

              if args.exempt_vendored and name in VENDORED:
                  print(f"SKIP {name}: vendored upstream fork, exempt per Master-Policy §1.6")
                  return 0

              kit = is_policy_kit(repo)
              violations = [f for f in tracked_markdown(repo) if not is_permitted(kit, f)]

              # Baseline: the pre-existing migration backlog, tracked in
              # Documentation-Migration-Roadmap. The gate blocks NEW violations immediately;
              # turning it fully red on day one is how a gate gets switched off instead of
              # obeyed. Shrink the baseline as the roadmap is worked; never grow it.
              bl_path = repo / BASELINE_NAME
              if args.write_baseline:
                  bl_path.write_text(
                      "# Master-Policy §1.6 migration backlog — pre-existing violations.\n"
                      "# The CI gate fails on any file NOT listed here, so this file may only\n"
                      "# ever SHRINK. Removing a line means that file was migrated to the vault.\n"
                      "# Tracked in 02 Areas/Policies/Documentation-Migration-Roadmap.md\n"
                      + "".join(f"{v}\n" for v in sorted(violations))
                  )
                  print(f"wrote {bl_path} with {len(violations)} baselined file(s)")
                  return 0

              baseline = set()
              if bl_path.exists():
                  baseline = {l.strip() for l in bl_path.read_text().splitlines()
                              if l.strip() and not l.startswith("#")}

              new = [v for v in violations if v not in baseline]
              stale = baseline - set(violations)

              if stale:
                  print(f"NOTE {name}: {len(stale)} baselined file(s) no longer present — "
                        f"remove them from {BASELINE_NAME}:")
                  for s in sorted(stale):
                      print(f"  - {s}")

              if not new:
                  msg = f" ({len(baseline)} known, in the migration backlog)" if baseline else ""
                  print(f"PASS {name}: no NEW prohibited markdown{msg}")
                  return 0

              print(f"FAIL {name}: {len(new)} NEW file(s) violate Master-Policy §1.6\n")
              for v in new:
                  print(f"  {v}")
              print(f"""
          Permitted markdown in a repository is exhaustive:
            {', '.join(sorted(PERMITTED_BASENAMES))}
          plus .github/ files, format notes adjacent to the artifacts they describe, and
          code-/CI-consumed markdown with a named consumer (a test, a served route, an
          alert runbook_url).

          Move these to /home/dev/obsidian-vault/01 Projects/<Project>/ — per §1.6, MOVE
          them (naming the vault destination in the commit message), never delete.

          If a file is genuinely an interface artifact, record a Policy Exception in the
          project's Overview.md under '## Policy Exceptions'.""")
              return 1


          if __name__ == "__main__":
              sys.exit(main())
          CHECKER_EOF
          python3 /tmp/check-doc-minimalism.py . $ARGS

      # ── AGENTS.md provenance ────────────────────────────────────────────────
      # Full drift detection needs the vault, which GitHub-hosted runners cannot
      # reach (private repo, no token wired up). Local pre-commit runs the real
      # `render-agents-md.py --check`. CI verifies the weaker invariant: that the
      # file is still generated and nobody replaced it with a hand-written copy.
      - name: "Gate — AGENTS.md is generated"
        run: |
          if [ ! -f AGENTS.md ]; then
            echo "::error::AGENTS.md is missing. Generate it: render-agents-md.py --repo . --profile <profile>"
            exit 1
          fi
          if ! grep -q "BEGIN GENERATED" AGENTS.md || ! grep -q "END GENERATED" AGENTS.md; then
            echo "::error::AGENTS.md has lost its generation markers — it was hand-edited or replaced."
            echo "::error::Regenerate from the vault: render-agents-md.py --repo . --profile <profile>"
            exit 1
          fi
          echo "ok: AGENTS.md carries generation markers"
