name: policy-check

# SELF-CONTAINED variant of the Master-Policy gates.
#
# Most repos call echoares-lab/dev-policies/.github/workflows/
# reusable-homelab-policy-check.yml. This repo cannot: GitHub does not allow a
# public repository (or a repository under a different owner) to call a
# reusable workflow hosted in a private one.
#
# GENERATED by dev-policies/tooling/scripts/render-standalone-policy-check.py
# from that reusable workflow. Do not hand-edit — regenerate instead.

on:
  workflow_dispatch:
  push:
    branches: [main, master, production]
  pull_request:

jobs:
  policy:
    name: Master-Policy gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          # The §1.6 baseline ratchet diffs the baseline against the PR base
          # commit, which a depth-1 checkout does not contain.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Gate 1: RETIRED 2026-08-14 (CICD-Policy §1.1.1) ────────────────────
      # MCP servers are configured once at user scope in ~/.claude.json, so no
      # repository carries a .mcp.json or .mcp.json.example and there is nothing
      # in a checkout to verify. Enforcing a repo-local file never delivered its
      # guarantee anyway: MCP resolves from the session's startup directory, so
      # the file only applied when a session happened to start in that repo.
      # See Master-Policy §1.5. Re-introducing a .mcp.json is blocked by the
      # pre-commit hook instead.

      # ── Gate 3: Secret scanning (CICD-Policy §1.1.3, Secrets-Policy §7) ─────
      - name: "Gate 3 — install gitleaks (pinned)"
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks

      - name: "Gate 3 — secret scan"
        run: |
          CONFIG_ARG=""
          [ -f .gitleaks.toml ] && CONFIG_ARG="--config .gitleaks.toml"
          /tmp/gitleaks dir $CONFIG_ARG --no-banner --redact .

      # ── Inlined checkers ────────────────────────────────────────────────────
      # The checkers are INLINED rather than checked out: dev-policies is
      # private, a caller's GITHUB_TOKEN cannot read another private repo, and
      # the read-only deploy key that would fix that is disabled org-wide
      # (E2.T3). Every region below is GENERATED by
      # tooling/scripts/sync-workflow-inline.py from its source file and split
      # into steps because GitHub rejects any workflow string over 21,000
      # characters — as a workflow-level "workflow file issue" with no job and
      # no log, which is how the first container-notice inline turned every
      # caller red on 2026-08-22. Edit the sources and re-run the sync;
      # dev-policies CI fails if a region is stale, and policy-check-self.yml
      # exercises this file at its own commit before it can reach master.
      # >>> INLINE /tmp/check-doc-minimalism.py >>>
      # GENERATED from tooling/scripts/check-doc-minimalism.py by tooling/scripts/sync-workflow-inline.py.
      # Do not edit here -- edit the source and re-run the sync; dev-policies CI fails on drift.
      # Split into 2 step(s): GitHub rejects any workflow string over 21,000 characters.
      - name: "Inline check-doc-minimalism.py (1/2)"
        run: |
          cat > /tmp/check-doc-minimalism.py <<'INLINE_EOF'
          #!/usr/bin/env python3
          """
          check-doc-minimalism.py — CI gate for Master-Policy §1.6

          Scans a repository's *tracked* markdown and fails when a file is outside the
          §1.6 permitted list. This is the CI backstop for the same rule the PreToolUse
          hook (tooling/hooks/block-prohibited-docs.py) enforces at write time — the hook
          catches an agent, this catches a human, a merge, or a session with hooks off.

          The permitted list is kept in ONE place — PERMITTED_BASENAMES below, imported by
          the hook — so the two enforcement points cannot drift apart.

          ── The baseline, and why it needs a ratchet ──────────────────────────────────
          A repo may carry a `.doc-minimalism-baseline` listing pre-existing violations so
          the gate can block NEW debt without turning red on day one. Left alone that file
          is permanent amnesty: the gate reports green forever while the debt never
          shrinks — the accretion pattern §1.6 exists to stop.

          `--ratchet` makes the baseline a one-way valve. It enforces four invariants:

            R1  EXPIRY      every baseline carries `# expires: YYYY-MM-DD`; amnesty is
                            time-bounded, never permanent. Past that date the baseline
                            grants nothing and every listed file is a live violation.
            R2  NO GROWTH   the baseline may not gain an entry relative to the base ref
                            (the PR base, or HEAD locally). Shrinking is always allowed.
            R3  SELF-CLEAN  a baselined path that is no longer a violation (migrated,
                            deleted, or now permitted) must be removed from the file.
                            Normal mode only NOTEs this; the ratchet fails on it, so the
                            baseline shrinks automatically as migration proceeds.
            R4  SCHEDULE    optional `# target: N by YYYY-MM-DD` checkpoints. Once the
                            date passes, more than N entries is a failure.

          Usage:
            check-doc-minimalism.py [repo_path] [--exempt-vendored]
            check-doc-minimalism.py [repo_path] --ratchet [--base REF]
            check-doc-minimalism.py [repo_path] --write-baseline --expires YYYY-MM-DD
                                                [--target "N by YYYY-MM-DD"]...

          Exit 0 = compliant, 1 = violations found.
          """

          import argparse
          import datetime as _dt
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          # ── The §1.6 permitted list (exhaustive), plus the 2026-08-12 amendments ──────
          PERMITTED_BASENAMES = {
              "README.md", "AGENTS.md", "CLAUDE.md", "GEMINI.md",
              "LICENSE", "LICENSE.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md",
          }
          # TOOLING.md was retired 2026-08-15 (Master-Policy §1.6) — write-once inventory
          # nothing consumed; native manifests are the tooling surface.

          # Paths permitted regardless of basename.
          PERMITTED_PATTERNS = [
              r"^\.github/",                       # GitHub-convention files
              r"(^|/)docs/openapi/",               # served by docs-server — interface artifact
              r"(^|/)docs/runbooks?/",             # alert runbook_url targets — interface artifact
              r"(^|/)testdata/", r"(^|/)fixtures/",  # test fixtures
              r"(^|/)node_modules/", r"(^|/)vendor/", r"(^|/)\.worktrees/",
              # Vendored Helm charts: `charts/<name>/` is Helm's own directory for a
              # vendored (sub)chart, so its markdown is upstream third-party content in
              # the same class as vendor/ and node_modules/ — not this repo's
              # documentation. Added 2026-08-22 for k3s-01's kubernetes-sigs/external-dns
              # 0.16.1 checkout, whose upstream RELEASE.md was being baselined as if it
              # were ours (README.md/CHANGELOG.md in the same directory already passed on
              # basename, so only the odd upstream filename was ever caught).
              r"(^|/)charts/[^/]+/",
          ]

          # dev-policies' kit content is its product (Policy-Kit-Boundary), NOT status logs.
          DEVPOLICIES_PRODUCT = (
              r"^(policies|overlays|profiles|adr|repo-pack|schemas|tooling|docs/policy-"
              r"|VERSIONING\.md$|policy-index\.md$)"
          )

          VENDORED = {"CLIProxyAPI", "Cli-Proxy-API-Management-Center"}


          def manifest_exemption(repo: Path) -> str | None:
              """Why tooling/repos.yaml exempts this checkout, or None.

              The manifest is the fleet's one statement of which repos are vendored
              upstream forks (`exempt: true`). Reading it here means the standard
              pre-commit set -- doc-minimalism included -- can be installed in such a
              repo unchanged (E7.T38: CLIProxyAPI is exempt from doc-minimalism, not
              from hooks) without a per-repo `--exempt-vendored` flag that a sync would
              have to special-case. A linked worktree resolves to its main checkout.

              Only meaningful where the manifest paths exist (a workstation). In CI the
              caller's checkout matches no manifest path, so this returns None and the
              workflow's explicit `--exempt-vendored` input still decides -- the flag is
              not retired, it is just no longer the only way.
              """
              try:
                  sys.path.insert(0, str(Path(__file__).resolve().parent))
                  import fleet  # noqa: E402
                  entries = fleet.load_manifest()
                  common = fleet.git_common_dir(repo)
              except (SystemExit, Exception):
                  return None
              candidates = {repo.resolve()}
              if common is not None:
                  candidates.add(common.parent.resolve())
              for e in entries:
                  if e.path.resolve() not in candidates:
                      continue
                  if e.exempt:
                      return e.reason or "vendored upstream fork"
                  if e.vendored_docs:
                      return "vendored upstream documentation (vendored_docs: true)"
              return None


          def is_policy_kit(repo: Path) -> bool:
              """Identify dev-policies by its CONTENT, not its directory name.

              Directory name is not a reliable identity: a git worktree is named after the
              branch, and `hardware`'s checkout directory does not match its repo name
              (`server-partpicker`). Name-based detection silently dropped the kit's
              product exemption and reported 91 false violations inside a worktree.
              """
              return (repo / "schemas" / "policy.schema.json").is_file() and (repo / "policies" / "baseline").is_dir()


          def tracked_markdown(repo: Path):
              try:
                  out = subprocess.run(["git", "-C", str(repo), "ls-files", "*.md", "*.markdown"],
                                       capture_output=True, text=True, check=True).stdout
              except subprocess.CalledProcessError:
                  return []
              return [l for l in out.splitlines() if l.strip()]


          def is_permitted(is_kit: bool, rel: str) -> bool:
              if Path(rel).name in PERMITTED_BASENAMES:
                  return True
              for pat in PERMITTED_PATTERNS:
                  if re.search(pat, rel):
                      return True
              if is_kit and re.match(DEVPOLICIES_PRODUCT, rel):
                  return True
              # Format notes adjacent to the artifacts they describe: a README.md inside a
              # data/asset directory is explicitly allowed by §1.6.
              if Path(rel).name == "README.md":
                  return True
              return False


          BASELINE_NAME = ".doc-minimalism-baseline"

          # Header directives, e.g.  "# expires: 2027-02-28"  /  "# target: 9 by 2026-10-31"
          _EXPIRES_RE = re.compile(r"^#\s*expires:\s*(\d{4}-\d{2}-\d{2})\s*$", re.I)
          _TARGET_RE = re.compile(r"^#\s*target:\s*(\d+)\s+by\s+(\d{4}-\d{2}-\d{2})\s*$", re.I)

          WARN_WINDOW_DAYS = 30


          class Baseline:
              """Parsed `.doc-minimalism-baseline`: entries plus its dated commitments."""

              def __init__(self, entries=None, expires=None, targets=None, exists=False, raw_comments=None):
                  self.entries = set(entries or ())
                  self.expires = expires              # datetime.date | None
                  self.targets = list(targets or ())  # [(int, date)]
                  self.exists = exists
                  self.raw_comments = list(raw_comments or ())

              def expired(self, today) -> bool:
                  return self.expires is not None and today > self.expires

              def missed_targets(self, today):
                  """Checkpoints whose date has passed and whose cap is exceeded."""
                  return [(n, d) for (n, d) in self.targets
                          if today > d and len(self.entries) > n]

              def upcoming(self, today):
                  """(cap, date) commitments falling due inside the warning window."""
                  soon = []
                  for n, d in self.targets:
                      if today <= d <= today + _dt.timedelta(days=WARN_WINDOW_DAYS) and len(self.entries) > n:
                          soon.append((n, d))
                  return soon


          def parse_baseline(text: str, exists: bool = True) -> Baseline:
              entries, expires, targets, comments = set(), None, [], []
              for line in text.splitlines():
                  s = line.strip()
                  if not s:
                      continue
                  if s.startswith("#"):
                      m = _EXPIRES_RE.match(s)
                      if m:
                          expires = _dt.date.fromisoformat(m.group(1))
                          continue
                      m = _TARGET_RE.match(s)
                      if m:
                          targets.append((int(m.group(1)), _dt.date.fromisoformat(m.group(2))))
                          continue
                      comments.append(line.rstrip("\n"))
                      continue
                  entries.add(s)
              targets.sort(key=lambda t: t[1])
              return Baseline(entries, expires, targets, exists, comments)


          def read_baseline(path: Path) -> Baseline:
              if not path.exists():
                  return Baseline(exists=False)
              return parse_baseline(path.read_text(), exists=True)


          def _git(repo: Path, *args):
              return subprocess.run(["git", "-C", str(repo), *args],
                                    capture_output=True, text=True)


          def rev_exists(repo: Path, ref: str) -> bool:
              return _git(repo, "rev-parse", "--verify", "--quiet", f"{ref}^{{commit}}").returncode == 0


          def baseline_at_ref(repo: Path, ref: str):
              """The baseline as committed at `ref`. None = the file did not exist there."""
              r = _git(repo, "show", f"{ref}:{BASELINE_NAME}")
              if r.returncode != 0:
                  return None
              return parse_baseline(r.stdout, exists=True)


          def resolve_base_ref(repo: Path, explicit):
              """Which revision the working tree's baseline is ratcheted against.

              Order: --base, then the PR base (GitHub sets GITHUB_BASE_REF on
              pull_request), then HEAD. HEAD always resolves in a real checkout, so on a
              push build the growth check degenerates to working-tree-vs-committed — a
              no-op that still exercises expiry, self-clean and schedule.
              """
              if explicit:
                  return explicit
              sha = os.environ.get("DOC_MINIMALISM_BASE_SHA", "").strip()
              if sha and rev_exists(repo, sha):
                  return sha
              br = os.environ.get("GITHUB_BASE_REF", "").strip()
              if br:
                  for cand in (f"origin/{br}", br):
                      if rev_exists(repo, cand):
                          return cand
              return "HEAD"


          def run_ratchet(repo: Path, name: str, violations, bl: Baseline, args, today) -> int:
              failures = []
              warnings = []

              if not bl.exists:
                  print(f"PASS {name}: no {BASELINE_NAME} — nothing to ratchet")
                  return 0

              # ── R1: amnesty must be time-bounded ─────────────────────────────────────
              if bl.expires is None:
                  failures.append(
                      f"{BASELINE_NAME} has no '# expires: YYYY-MM-DD' header. A baseline "
                      f"without an expiry is permanent amnesty and is not allowed; add a "
                      f"date by which the backlog will be zero.")
              elif bl.expired(today):
                  failures.append(
                      f"amnesty EXPIRED on {bl.expires} ({(today - bl.expires).days} day(s) "
                      f"ago) with {len(bl.entries)} entr(y/ies) still baselined. Migrate the "
                      f"remaining files to the vault, or renew the expiry with a written "
                      f"justification in the Documentation-Migration-Roadmap.")
              elif (bl.expires - today).days <= WARN_WINDOW_DAYS and bl.entries:
                  warnings.append(f"amnesty expires {bl.expires} "
                                  f"(in {(bl.expires - today).days} day(s)) with "
                                  f"{len(bl.entries)} entr(y/ies) left")

              # ── R2: the baseline may never gain an entry ─────────────────────────────
              base_ref = resolve_base_ref(repo, args.base)
              if args.base and not rev_exists(repo, args.base):
                  print(f"ERROR {name}: --base {args.base!r} is not a resolvable commit")
                  return 1
              prev = baseline_at_ref(repo, base_ref)
              if prev is None:
                  if not args.allow_new_baseline:
                      failures.append(
                          f"{BASELINE_NAME} does not exist at base ref {base_ref} — this "
                          f"change INTRODUCES a baseline, i.e. {len(bl.entries)} new "
                          f"amnesty entr(y/ies). Introducing amnesty must be deliberate: "
                          f"re-run with --allow-new-baseline if that is intended.")
              else:
                  grown = sorted(bl.entries - prev.entries)
                  if grown:
                      failures.append(
                          f"{BASELINE_NAME} GREW by {len(grown)} entr(y/ies) against "
                          f"{base_ref} ({len(prev.entries)} -> {len(bl.entries)}). The "
                          f"baseline may only ever shrink; new prohibited markdown must be "
                          f"written to the vault, not baselined:\n"
                          + "".join(f"      + {g}\n" for g in grown).rstrip())
                  # Loosening the expiry is growth by another name.
                  if prev.expires and bl.expires and bl.expires > prev.expires:
                      warnings.append(
                          f"expiry EXTENDED {prev.expires} -> {bl.expires}; justify this in "
                          f"the Documentation-Migration-Roadmap")

              # ── R3: stale entries must be pruned so the baseline self-cleans ─────────
              stale = sorted(bl.entries - set(violations))
              if stale:
                  failures.append(
                      f"{len(stale)} baselined path(s) are no longer violations (migrated, "
                      f"deleted, or now permitted) but are still listed. Remove them so the "
                      f"baseline reflects the real backlog:\n"
                      + "".join(f"      - {s}\n" for s in stale).rstrip())

              # ── R4: scheduled burn-down checkpoints ──────────────────────────────────
              for n, d in bl.missed_targets(today):
                  failures.append(
                      f"MISSED burn-down target: {len(bl.entries)} entries remain, but the "
                      f"schedule required <= {n} by {d}.")
              for n, d in bl.upcoming(today):
                  warnings.append(f"burn-down target <= {n} due {d} "
                                  f"(in {(d - today).days} day(s)); {len(bl.entries)} remain")

              for w in warnings:
                  print(f"WARN {name}: {w}")

              if failures:
                  print(f"\nFAIL {name}: doc-minimalism baseline ratchet violated "
                        f"({len(failures)} problem(s))\n")
                  for f in failures:
                      print(f"  * {f}")
                  print(f"""
          The baseline is a one-way valve, not a parking lot: it may shrink, never grow,
          and its amnesty is dated. Migrate the listed files to
          /home/dev/obsidian-vault/01 Projects/<Project>/ (MOVE, never delete) and delete
          their lines from {BASELINE_NAME}.""")
                  return 1

              nxt = next(((n, d) for n, d in bl.targets if d >= today), None)  # targets are date-sorted
              sched = f", next target <= {nxt[0]} by {nxt[1]}" if nxt else ""
              print(f"PASS {name}: baseline ratchet ok — {len(bl.entries)} entr(y/ies), "
                    f"expires {bl.expires}{sched}")
              return 0


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("repo", nargs="?", default=".", type=Path)
              ap.add_argument("--exempt-vendored", action="store_true")
              ap.add_argument("--write-baseline", action="store_true",
                              help="record current violations as the accepted backlog")
              ap.add_argument("--expires", help="baseline expiry date (YYYY-MM-DD) for --write-baseline")
              ap.add_argument("--target", action="append", default=[],
                              metavar="'N by YYYY-MM-DD'",
                              help="burn-down checkpoint for --write-baseline; repeatable")
              ap.add_argument("--ratchet", action="store_true",
                              help="enforce that the baseline shrinks, cannot grow, and expires")
              ap.add_argument("--base", help="revision to ratchet against (default: PR base, else HEAD)")
              ap.add_argument("--allow-new-baseline", action="store_true",
                              help="permit --ratchet to accept a baseline file that is new at the base ref")
              args = ap.parse_args()

              repo = args.repo.resolve()
          INLINE_EOF
      - name: "Inline check-doc-minimalism.py (2/2)"
        run: |
          cat >> /tmp/check-doc-minimalism.py <<'INLINE_EOF'
              name = repo.name
              today = _dt.date.today()

              if args.exempt_vendored and name in VENDORED:
                  print(f"SKIP {name}: vendored upstream fork, exempt per Master-Policy §1.6")
                  return 0
              reason = manifest_exemption(repo)
              if reason:
                  print(f"SKIP {name}: {reason} -- exempt: true in dev-policies/tooling/repos.yaml "
                        "(Master-Policy §1.6)")
                  return 0

              kit = is_policy_kit(repo)
              violations = [f for f in tracked_markdown(repo) if not is_permitted(kit, f)]

              # Baseline: the pre-existing migration backlog, tracked in
              # Documentation-Migration-Roadmap. The gate blocks NEW violations immediately;
              # turning it fully red on day one is how a gate gets switched off instead of
              # obeyed. Shrink the baseline as the roadmap is worked; never grow it — that
              # last clause is enforced by --ratchet, not left to good intentions.
              bl_path = repo / BASELINE_NAME

              if args.write_baseline:
                  existing = read_baseline(bl_path)
                  expires = args.expires or (existing.expires.isoformat() if existing.expires else None)
                  if not expires:
                      print("ERROR: --write-baseline requires --expires YYYY-MM-DD "
                            "(a baseline without an expiry is permanent amnesty).")
                      return 1
                  _dt.date.fromisoformat(expires)  # validate, raise loudly on garbage
                  targets = []
                  for t in args.target:
                      m = _TARGET_RE.match(f"# target: {t.strip()}")
                      if not m:
                          print(f"ERROR: --target {t!r} must look like '9 by 2026-10-31'")
                          return 1
                      targets.append((int(m.group(1)), m.group(2)))
                  if not targets:
                      targets = [(n, d.isoformat()) for n, d in existing.targets]
                  bl_path.write_text(
                      "# Master-Policy §1.6 migration backlog — pre-existing violations.\n"
                      "# The CI gate fails on any file NOT listed here, so this file may only\n"
                      "# ever SHRINK. Removing a line means that file was migrated to the vault.\n"
                      "# Tracked in 02 Areas/Policies/Documentation-Migration-Roadmap.md\n"
                      "#\n"
                      "# Amnesty is DATED and ratcheted (check-doc-minimalism.py --ratchet):\n"
                      "#   expires: after this date every line below is a live CI failure.\n"
                      "#   target:  a burn-down checkpoint; exceeding the cap after the date fails.\n"
                      f"# expires: {expires}\n"
                      + "".join(f"# target: {n} by {d}\n" for n, d in targets)
                      + "".join(f"{v}\n" for v in sorted(violations))
                  )
                  print(f"wrote {bl_path} with {len(violations)} baselined file(s), "
                        f"expires {expires}")
                  return 0

              bl = read_baseline(bl_path)

              if args.ratchet:
                  return run_ratchet(repo, name, violations, bl, args, today)

              # ── Normal mode ──────────────────────────────────────────────────────────
              baseline = bl.entries
              if bl.expired(today):
                  # Expired amnesty grants nothing: everything it covered is live again.
                  print(f"NOTE {name}: baseline amnesty expired {bl.expires} — its "
                        f"{len(baseline)} entr(y/ies) no longer suppress failures.")
                  baseline = set()

              new = [v for v in violations if v not in baseline]
              stale = baseline - set(violations)

              if stale:
                  print(f"NOTE {name}: {len(stale)} baselined file(s) no longer present — "
                        f"remove them from {BASELINE_NAME}:")
                  for s in sorted(stale):
                      print(f"  - {s}")

              if not new:
                  msg = f" ({len(baseline)} known, in the migration backlog)" if baseline else ""
                  print(f"PASS {name}: no NEW prohibited markdown{msg}")
                  return 0

              print(f"FAIL {name}: {len(new)} NEW file(s) violate Master-Policy §1.6\n")
              for v in new:
                  print(f"  {v}")
              print(f"""
          Permitted markdown in a repository is exhaustive:
            {', '.join(sorted(PERMITTED_BASENAMES))}
          plus .github/ files, format notes adjacent to the artifacts they describe, and
          code-/CI-consumed markdown with a named consumer (a test, a served route, an
          alert runbook_url).

          Move these to /home/dev/obsidian-vault/01 Projects/<Project>/ — per §1.6, MOVE
          them (naming the vault destination in the commit message), never delete.

          If a file is genuinely an interface artifact, record a Policy Exception in the
          project's Overview.md under '## Policy Exceptions'.""")
              return 1


          if __name__ == "__main__":
              sys.exit(main())
          INLINE_EOF
      # <<< INLINE /tmp/check-doc-minimalism.py <<<
      # >>> INLINE /tmp/check-container-notices.py >>>
      # GENERATED from tooling/scripts/check-container-notices.py by tooling/scripts/sync-workflow-inline.py.
      # Do not edit here -- edit the source and re-run the sync; dev-policies CI fails on drift.
      # Split into 2 step(s): GitHub rejects any workflow string over 21,000 characters.
      - name: "Inline check-container-notices.py (1/2)"
        run: |
          cat > /tmp/check-container-notices.py <<'INLINE_EOF'
          #!/usr/bin/env python3
          """
          check-container-notices.py — Licensing-Policy §3 gate for container builds.

          A container image is a redistribution. When a build takes somebody else's code
          and bakes it into an image that is then pushed to a registry, the licence's
          notice condition (MIT's "shall be included in all copies", Apache-2.0 §4(a)'s
          "give any other recipients ... a copy of this License") binds the *builder*,
          not upstream — and nothing in this
          estate checked that. Backlog E7.T26: a grep for licence/notice/copyright across
          every Dockerfile in the fleet returned zero matches. Two were fixed by hand
          (ai-gateway/Dockerfile.cliproxy, CLIProxyAPI/Dockerfile); this is the gate that
          stops the next one.

          ── What counts as redistribution ────────────────────────────────────────────
          The hard part is not the check, it is the scope. A gate that fires on cases
          that are not really the builder's obligation gets bypassed, and a bypassed gate
          is worth less than no gate. So three detections fire, and several plausible
          ones deliberately do not.

          FIRES:

            binary-download        A prebuilt third-party artifact is fetched from the
                                   network (`ADD <url>`, or `curl`/`wget` writing a file
                                   or piping into a shell/tar) and lands in the image.
                                   Unambiguous redistribution: the bytes in the image are
                                   upstream's, and no package manager put licence
                                   metadata next to them. Scoped to the final stage, plus
                                   any builder stage the final stage copies out of — a
                                   download in a stage that is thrown away redistributes
                                   nothing.

            upstream-source-build  The build context is somebody else's source tree (a
                                   vendored/forked repo: root LICENSE whose copyright
                                   holder is not first-party) and the Dockerfile copies
                                   that source in. Compiling upstream source and shipping
                                   the result is redistribution exactly as shipping their
                                   binary is. This is the CLIProxyAPI case.

            notice-propagating-base
                                   The FINAL stage's base image is one whose licence
                                   reaches out of the base and binds the DERIVATIVE work —
                                   Apache-2.0 §4(a) ("You must give any other recipients of
                                   the Work or Derivative Works a copy of this License"),
                                   and §4(d) on top of it where upstream ships a NOTICE
                                   file. Ordinary permissive base images are NOT the
                                   builder's obligation: their own layers carry their own
                                   notices and the image ships them unchanged.

                                   Which clause actually bites is a per-image fact, so the
                                   config records it (`clause:`) alongside the evidence.
                                   For ghcr.io/mlflow/mlflow it is §4(a), not §4(d): the
                                   upstream repo has no NOTICE file, which was checked
                                   rather than assumed.

                                   There is no licence database here and none is coming.
                                   Base images are therefore classified by an EXPLICIT,
                                   evidence-carrying map in the config: each entry records
                                   the licence and where it was read. An image absent from
                                   the map is OUT OF SCOPE and reported as such, never
                                   guessed at. That is the difference between a check that
                                   fires on real cases and one that fires on `FROM
                                   python:3.12-slim`.

          DOES NOT FIRE (rejected as noise):

            * A `FROM` of any third-party base image, generically. Every Dockerfile in
              the fleet has one. The base's layers carry the base's notices already, so
              this is upstream's obligation, not ours — with the Apache-2.0 exception
              above.
            * `pip install` / `apk add` / `apt-get install` / `go mod download` /
              `uv sync`. These do redistribute third-party code, but each ecosystem
              installs its own licence metadata alongside the package (`*.dist-info/`,
              `/usr/share/doc/*/copyright`, module cache), and the volume is thousands of
              packages per image. Gating here fails all nine Dockerfiles on day one.
              Dependency licensing is Licensing-Policy §4's problem and its answer is the
              CycloneDX SBOM that the builds already produce — not this file.
            * `COPY --from=<stage> <dir>` of an opaque directory. What is inside cannot
              be known from the Dockerfile, so any verdict would be a guess.
            * First-party source copied into a first-party image. Nothing is
              redistributed that we do not own.

          ── Where the notice must be ─────────────────────────────────────────────────
          In the FINAL stage. This is the trap that caught CLIProxyAPI: `COPY . .` put
          the upstream LICENSE into the *builder* stage, which is discarded, so the
          pushed image carried none of it. Satisfaction is therefore only ever counted
          from instructions in the last stage of the file.

          ── Waivers ──────────────────────────────────────────────────────────────────
          Same shape as k3s-01/image-pin-policy.yaml: every waiver names the exact
          Dockerfile and the exact rule, carries a mandatory `reason`, and carries a
          mandatory `expires` that is ENFORCED — past its date the waiver stops matching
          and the finding is live again, so debt cannot renew itself by being ignored.
          Every applied waiver is printed as WAIVED on every run.

          Usage:
            check-container-notices.py [repo_path ...]      # default: cwd
            check-container-notices.py --config PATH
            check-container-notices.py --ignore-waivers     # what the fleet looks like raw
            check-container-notices.py --as-of YYYY-MM-DD   # waiver expiry, simulated

          Exit 0 = every Dockerfile compliant (or waived), 1 = at least one violation.
          """

          from __future__ import annotations

          import argparse
          import datetime as _dt
          import re
          import sys
          from pathlib import Path

          import yaml

          SCRIPT_DIR = Path(__file__).resolve().parent
          DEFAULT_CONFIG = SCRIPT_DIR.parent.parent / "policy" / "container-notice-policy.yaml"

          # A repo-local waiver file, merged on top of the fleet config. Waivers belong
          # where the person who can fix the Dockerfile will see them; the fleet config
          # holds the base-image classification, which is a fleet-wide fact.
          LOCAL_WAIVERS = ".container-notice-waivers.yaml"

          DOCKERFILE_NAMES = re.compile(r"^(Dockerfile|Containerfile)(\..+)?$|^.+\.Dockerfile$")

          SKIP_DIRS = {".git", "node_modules", "vendor", ".venv", "venv", "__pycache__",
                       ".terraform", "dist", "build", ".next", ".cache", ".worktrees"}

          # ── notice detection ──────────────────────────────────────────────────────────

          # A path or filename that IS a licence notice. Matched against COPY/ADD operands.
          NOTICE_PATH = re.compile(r"(?i)(licen[cs]e|notice|copying|copyright)")

          # A RUN that materialises a notice INTO the image. The verb list matters: a bare
          # mention of the word "license" in a RUN (a package name, a comment, a URL query)
          # must not be read as satisfaction, because a false "satisfied" fails open.
          NOTICE_RUN_VERB = re.compile(
              r"(?i)\b(cp|install|tar|unzip|curl|wget|mkdir|mv|cat|echo|printf)\b|>>?\s*\S")

          URL = re.compile(r"(?i)\bhttps?://\S+")

          # curl/wget that produce a FILE (or feed one straight into a shell or tar),
          # as opposed to curl used to poke an endpoint in a healthcheck or a wait loop.
          FETCHER = re.compile(r"(?i)\b(curl|wget)\b")
          FETCH_SINK = re.compile(
              r"(?i)(-O\b|-o\s|--output\b|--output-document\b|>\s*\S|\|\s*(tar|sh|bash|unzip|zcat|gunzip|install)\b)")

          # Year spans in the wild are messy — CLIProxyAPI's upstream LICENSE literally
          # reads "Copyright (c) 2025-2005.9 Luis Pater". Consume any leading run of
          # digits/dots/commas/dashes and an optional "present" before the holder.
          COPYRIGHT_LINE = re.compile(
              r"(?i)copyright\s*(\(c\)|©)?\s*(?:[0-9][0-9.,\s\-]*)?(?:present[\s\-]*)?(?P<holder>\S.*)")


          # ── Dockerfile parsing ────────────────────────────────────────────────────────

          class Instr:
              __slots__ = ("kw", "value", "lineno")

              def __init__(self, kw: str, value: str, lineno: int):
                  self.kw, self.value, self.lineno = kw, value, lineno

              def __repr__(self) -> str:  # pragma: no cover - debugging aid
                  return f"<{self.kw} L{self.lineno} {self.value[:40]!r}>"


          class Stage:
              def __init__(self, image: str, alias: str | None, lineno: int):
                  self.image = image
                  self.alias = alias
                  self.lineno = lineno
                  self.instrs: list[Instr] = []


          def parse_dockerfile(text: str) -> list[Stage]:
              """Stages in file order. Line continuations joined; comments dropped."""
              logical: list[tuple[int, str]] = []
              buf, start = "", 0
              for n, raw in enumerate(text.splitlines(), 1):
                  line = raw.rstrip()
                  if not buf and (not line.strip() or line.lstrip().startswith("#")):
                      continue
                  if not buf:
                      start = n
                  stripped = line.strip()
                  if stripped.endswith("\\"):
                      buf += stripped[:-1] + " "
                      continue
                  buf += stripped
                  # A continued line may itself contain comment-only fragments; harmless.
                  logical.append((start, buf))
                  buf = ""
              if buf:
                  logical.append((start, buf))

              stages: list[Stage] = []
              pre_from: list[Instr] = []
              for lineno, line in logical:
                  kw, _, rest = line.partition(" ")
                  kw = kw.upper()
                  if kw == "FROM":
                      parts = rest.split()
                      image = parts[0] if parts else ""
                      alias = None
                      for i, p in enumerate(parts):
                          if p.upper() == "AS" and i + 1 < len(parts):
                              alias = parts[i + 1]
                      st = Stage(image, alias, lineno)
                      st.instrs.extend(pre_from)
                      pre_from = []
                      stages.append(st)
                  elif stages:
                      stages[-1].instrs.append(Instr(kw, rest.strip(), lineno))
                  else:
                      pre_from.append(Instr(kw, rest.strip(), lineno))
              return stages


          def copy_from_sources(stage: Stage) -> set[str]:
              """Stage names/indices this stage copies artifacts OUT of."""
              out = set()
              for ins in stage.instrs:
                  if ins.kw != "COPY":
                      continue
                  m = re.search(r"--from=(\S+)", ins.value)
                  if m:
                      out.add(m.group(1))
              return out


          # ── notice satisfaction ───────────────────────────────────────────────────────

          def notice_evidence(stage: Stage) -> tuple[Instr, str] | None:
              """The instruction in THIS stage that puts a licence notice into the image,
              with the fragment that matched — a RUN is often 200 characters of `&&` chain
              and quoting the head of it would hide the very thing that satisfied the rule."""
              for ins in stage.instrs:
                  if ins.kw in ("COPY", "ADD"):
                      operands = [w for w in ins.value.split() if not w.startswith("--")]
                      hit = next((w for w in operands if NOTICE_PATH.search(w)), None)
                      if hit:
                          return ins, ins.value.strip()
                  elif ins.kw == "RUN":
                      m = NOTICE_PATH.search(ins.value)
                      if m and NOTICE_RUN_VERB.search(ins.value):
                          lo = max(0, m.start() - 45)
                          return ins, "..." + ins.value[lo:m.end() + 25].strip() + "..."
              return None


          # ── detections ────────────────────────────────────────────────────────────────

          def find_downloads(stage: Stage) -> list[Instr]:
              hits = []
              for ins in stage.instrs:
                  if ins.kw == "ADD" and URL.search(ins.value):
                      hits.append(ins)
                  elif ins.kw == "RUN" and URL.search(ins.value) and FETCHER.search(ins.value) \
                          and FETCH_SINK.search(ins.value):
                      hits.append(ins)
              return hits


          def copies_build_context(stage: Stage) -> Instr | None:
              for ins in stage.instrs:
                  if ins.kw not in ("COPY", "ADD"):
                      continue
                  if "--from=" in ins.value or URL.search(ins.value):
                      continue
                  return ins
              return None


          def licence_holder(repo: Path) -> str | None:
              for name in ("LICENSE", "LICENSE.md", "LICENSE.txt", "COPYING"):
                  p = repo / name
                  if not p.is_file():
                      continue
                  for line in p.read_text(errors="replace").splitlines()[:20]:
                      m = COPYRIGHT_LINE.search(line)
                      if m:
                          return m.group("holder").strip().rstrip(".")
              return None


          def base_image_rule(image: str, cfg: dict) -> dict | None:
              for entry in cfg.get("base_images", []):
                  if re.search(entry["match"], image):
                      return entry
              return None


          # ── waivers ───────────────────────────────────────────────────────────────────

          class Waiver:
              def __init__(self, d: dict, source: str):
                  for key in ("dockerfile", "rule", "reason", "expires"):
                      if not d.get(key):
                          raise SystemExit(
                              f"ERROR: waiver in {source} is missing required key '{key}': {d!r}\n"
                              "       Every waiver MUST name the dockerfile, the rule, a reason "
                              "and an expiry.")
                  self.dockerfile = str(d["dockerfile"])
                  self.rule = str(d["rule"])
                  self.reason = str(d["reason"])
                  try:
                      self.expires = _dt.date.fromisoformat(str(d["expires"]))
                  except ValueError:
                      raise SystemExit(f"ERROR: waiver in {source}: expires "
                                       f"'{d['expires']}' is not YYYY-MM-DD")
                  self.source = source
                  self.used = False       # suppressed a finding on this run
                  self.in_scope = False   # its Dockerfile was actually scanned on this run

              def matches(self, ident: str, rel: str, rule: str) -> bool:
                  return self.rule == rule and self.dockerfile in (ident, rel)


          def load_config(path: Path, repos: list[Path]) -> tuple[dict, list[Waiver]]:
              if not path.is_file():
                  raise SystemExit(f"ERROR: config not found: {path}")
              cfg = yaml.safe_load(path.read_text()) or {}
              waivers = [Waiver(w, str(path)) for w in (cfg.get("waivers") or [])]
              for repo in repos:
                  local = repo / LOCAL_WAIVERS
                  if local.is_file():
                      data = yaml.safe_load(local.read_text()) or {}
                      waivers += [Waiver(w, str(local)) for w in (data.get("waivers") or [])]
              return cfg, waivers


          # ── the check ─────────────────────────────────────────────────────────────────

          class Finding:
              def __init__(self, rule: str, detail: str, lineno: int):
                  self.rule, self.detail, self.lineno = rule, detail, lineno


          def check_dockerfile(path: Path, repo: Path, cfg: dict) -> tuple[list[Finding], list[str]]:
              """(findings, notes) for one Dockerfile."""
              stages = parse_dockerfile(path.read_text(errors="replace"))
              notes: list[str] = []
              if not stages:
                  return [], ["no FROM instruction — not an image build"]

              final = stages[-1]
              ev = notice_evidence(final)

              # Which earlier stages does the final stage pull artifacts out of? Their
              # downloads reach the shipped image; the rest are thrown away.
              reached = set()
              refs = copy_from_sources(final)
              for i, st in enumerate(stages[:-1]):
                  if str(i) in refs or (st.alias and st.alias in refs):
                      reached.add(i)

              findings: list[Finding] = []

              # ── binary-download ──────────────────────────────────────────────────────
              for i, st in enumerate(stages):
                  if not (st is final or i in reached):
                      continue
                  where = "final stage" if st is final else f"builder stage '{st.alias or i}' (copied into the final stage)"
                  for ins in find_downloads(st):
                      findings.append(Finding(
                          "binary-download",
                          f"L{ins.lineno}: {where} fetches a prebuilt third-party artifact "
                          f"({ins.kw} {ins.value[:90].strip()}...)", ins.lineno))

          INLINE_EOF
      - name: "Inline check-container-notices.py (2/2)"
        run: |
          cat >> /tmp/check-container-notices.py <<'INLINE_EOF'
              # ── upstream-source-build ────────────────────────────────────────────────
              holder = licence_holder(repo)
              first_party = {h.lower() for h in cfg.get("first_party_holders", [])}
              if holder and holder.lower() not in first_party:
                  ctx = None
                  for st in stages:
                      ctx = copies_build_context(st)
                      if ctx:
                          break
                  if ctx:
                      findings.append(Finding(
                          "upstream-source-build",
                          f"L{ctx.lineno}: build context is a third-party source tree "
                          f"(root LICENSE holds copyright '{holder}') and it is copied into "
                          f"the build ({ctx.kw} {ctx.value[:60].strip()})", ctx.lineno))

              # ── notice-propagating-base ──────────────────────────────────────────────
              entry = base_image_rule(final.image, cfg)
              if entry is None:
                  notes.append(f"base image '{final.image}' is not classified in the config — "
                               "out of scope for notice-propagation (see the config's base_images)")
              elif entry.get("requires_notice"):
                  findings.append(Finding(
                      "notice-propagating-base",
                      f"L{final.lineno}: final stage builds on '{final.image}' "
                      f"({entry['licence']}); {entry.get('clause', 'its licence')} binds this "
                      f"derivative work", final.lineno))
              else:
                  notes.append(f"base image '{final.image}' — {entry['licence']}, no "
                               "notice-propagation clause")

              if ev and findings:
                  ins, frag = ev
                  notes.append(f"satisfied: notice reaches the FINAL stage at L{ins.lineno} "
                               f"({ins.kw} {frag})")
                  for f in findings:
                      notes.append(f"  obligation detected and met: [{f.rule}] {f.detail}")
                  return [], notes
              if ev:
                  notes.append(f"notice present at L{ev[0].lineno} (no obligation detected)")
              return findings, notes


          def repo_dockerfiles(repo: Path) -> list[Path]:
              out = []
              for p in sorted(repo.rglob("*")):
                  if not p.is_file():
                      continue
                  if any(part in SKIP_DIRS for part in p.relative_to(repo).parts[:-1]):
                      continue
                  if DOCKERFILE_NAMES.match(p.name):
                      out.append(p)
              return out


          def run(repos: list[Path], cfg: dict, waivers: list[Waiver],
                  as_of: _dt.date, ignore_waivers: bool) -> bool:
              print("== container notice obligations (Licensing-Policy §3, E7.T26) ==")
              print(f"as-of: {as_of}"
                    + ("  [--ignore-waivers: waivers not applied]" if ignore_waivers else ""))
              print()

              ok = True
              total = 0
              scanned: set[str] = set()
              for repo in repos:
                  files = repo_dockerfiles(repo)
                  if not files:
                      continue
                  print(f"  {repo}")
                  for df in files:
                      total += 1
                      rel = str(df.relative_to(repo))
                      ident = f"{repo.name}/{rel}"
                      scanned.update((rel, ident))
                      findings, notes = check_dockerfile(df, repo, cfg)
                      live = []
                      for f in findings:
                          w = None if ignore_waivers else next(
                              (x for x in waivers if x.matches(ident, rel, f.rule)), None)
                          if w and w.expires < as_of:
                              print(f"    EXPIRED WAIVER  {rel}  [{f.rule}] expired {w.expires} "
                                    f"({w.source})")
                              w.used = True
                              live.append(f)
                          elif w:
                              w.used = True
                              print(f"    WAIVED  {rel}  [{f.rule}] until {w.expires} — {w.reason}")
                          else:
                              live.append(f)
                      if live:
                          ok = False
                          print(f"    FAIL    {rel}")
                          for f in live:
                              print(f"              [{f.rule}] {f.detail}")
                          print("              No licence notice reaches the FINAL stage. Add the "
                                "upstream LICENSE/NOTICE to the final image, or waive with a "
                                "reason and an expiry.")
                      else:
                          print(f"    ok      {rel}")
                      for n in notes:
                          print(f"              note: {n}")
                  print()

              # A waiver is stale only if its Dockerfile WAS scanned and the finding it
              # covers did not appear — the debt is gone, so the waiver must go too. A
              # waiver for a repo this run did not look at is out of scope, not stale:
              # failing on it would make a single-repo hook red for every other repo's
              # waivers, which is precisely the unactionable failure that trains people
              # to reach for --no-verify.
              if not ignore_waivers:
                  stale = [w for w in waivers if not w.used and w.dockerfile in scanned]
                  out_of_scope = [w for w in waivers if not w.used and w.dockerfile not in scanned]
                  if out_of_scope:
                      print(f"  {len(out_of_scope)} waiver(s) not exercised — their Dockerfile "
                            "was outside this run's scope:")
                      for w in out_of_scope:
                          print(f"    (skipped) {w.dockerfile}  [{w.rule}]")
                      print()
                  if stale:
                      print("  STALE waivers — the finding they cover no longer occurs. Delete them:")
                      for w in stale:
                          print(f"    {w.dockerfile}  [{w.rule}]  ({w.source})")
                      print()
                      ok = False

              print(f"container notices: {'PASS' if ok else 'FAIL'} ({total} Dockerfile(s) checked)")
              return ok


          def main(argv: list[str] | None = None) -> int:
              ap = argparse.ArgumentParser(description=__doc__.split("\n")[1],
                                           formatter_class=argparse.RawDescriptionHelpFormatter)
              ap.add_argument("repos", nargs="*", default=None,
                              help="repository roots to scan (default: cwd)")
              ap.add_argument("--config", type=Path, default=DEFAULT_CONFIG)
              ap.add_argument("--ignore-waivers", action="store_true")
              ap.add_argument("--as-of", default=None,
                              help="YYYY-MM-DD used for waiver expiry (default: today)")
              args = ap.parse_args(argv)

              repos = [Path(r).resolve() for r in (args.repos or [Path.cwd()])]
              for r in repos:
                  if not r.is_dir():
                      raise SystemExit(f"ERROR: not a directory: {r}")
              as_of = _dt.date.fromisoformat(args.as_of) if args.as_of else _dt.date.today()
              cfg, waivers = load_config(args.config, repos)
              return 0 if run(repos, cfg, waivers, as_of, args.ignore_waivers) else 1


          if __name__ == "__main__":
              sys.exit(main())
          INLINE_EOF
      # <<< INLINE /tmp/check-container-notices.py <<<
      # >>> INLINE /tmp/container-notice-policy.yaml >>>
      # GENERATED from policy/container-notice-policy.yaml by tooling/scripts/sync-workflow-inline.py.
      # Do not edit here -- edit the source and re-run the sync; dev-policies CI fails on drift.
      # Split into 1 step(s): GitHub rejects any workflow string over 21,000 characters.
      - name: "Inline container-notice-policy.yaml (1/1)"
        run: |
          cat > /tmp/container-notice-policy.yaml <<'INLINE_EOF'
          # Container notice policy for tooling/scripts/check-container-notices.py
          # (Licensing-Policy §3, backlog E7.T26).
          #
          # A container image is a redistribution. When a build here bakes somebody
          # else's code into an image and pushes it to nexus-docker.infra.plexplease.com,
          # the licence's notice condition binds US, not upstream. Licensing-Policy §3
          # says so for repositories ("A public fork MUST keep the upstream notice intact
          # in what it publishes"); this file is what makes it true for images.
          #
          # What the check decides, and what THIS file decides, are deliberately split:
          #
          #   the script  decides whether a Dockerfile REDISTRIBUTES third-party code
          #               (a downloaded binary, an upstream source tree) and whether a
          #               notice reaches the FINAL stage. That is structural and is read
          #               off the Dockerfile itself.
          #   this file   decides which BASE IMAGES carry a notice obligation that reaches
          #               out of the base and binds the derivative work, and which
          #               copyright holders are first-party. Those are facts about the
          #               world, not about the file, and neither can be derived from a
          #               Dockerfile. There is no licence database in this estate and none
          #               is coming, so they are written down here with the evidence that
          #               was actually read.

          # A root LICENSE whose copyright holder is NOT one of these marks the tree as
          # somebody else's work, which is what makes `upstream-source-build` fire.
          # Both spellings are the same operator; Licensing-Policy §1 (copyright-holder)
          # is the rule that will eventually collapse them to one.
          first_party_holders:
            - echoares-lab
            - TheNorthWestPassage

          # ── Base-image classification ────────────────────────────────────────────────
          #
          # `match` is a regex against the FROM reference of the FINAL stage. First match
          # wins. An image that matches NOTHING here is reported as out of scope, not
          # guessed at: a check that invents a licence for `FROM some/image` is a check
          # that cries wolf, and Licensing-Policy §4 already says class is decided by the
          # identifier a package actually declares, never by reputation.
          #
          # `requires_notice: true` means: this base's licence obliges the builder of a
          # DERIVATIVE to ship licence text with it. Permissive licences that bind only
          # the copy of the base's own layers (MIT, BSD) do not — those layers are in the
          # image already, carrying their own notices, and re-stating them is not the
          # builder's obligation. Apache-2.0 is the case that does reach out: §4(a)
          # requires a copy of the License to accompany any Derivative Work distributed,
          # independently of whether §4(d)'s NOTICE file exists upstream.
          base_images:
            - match: "^ghcr\\.io/mlflow/mlflow(:|@|$)"
              licence: Apache-2.0
              requires_notice: true
              clause: "Apache-2.0 §4(a) — a copy of the License must accompany a distributed Derivative Work"
              evidence: >-
                github.com/mlflow/mlflow LICENSE.txt read via the GitHub API on 2026-08-22
                (blob db7cb10b5e330d56b40370bc178974ccabe71458): "Copyright 2018 Databricks,
                Inc." + the Apache License 2.0 text. Note for accuracy: the upstream repo has
                NO root NOTICE file (raw.githubusercontent.com/.../NOTICE returns 404 on the
                same date), so §4(d) is NOT the operative clause here — §4(a) is. The
                derivative IS distributed: k3s-01's image is pushed to
                nexus-docker.infra.plexplease.com/mlflow and pulled by the cluster with an
                imagePullSecret.

            # Explicitly classified as NOT propagating, so the "out of scope" note in the
            # output means "nobody has looked at this one yet" rather than "everything is
            # fine". Each licence below was read from the image's own upstream project.
            - match: "^alpine(:|@|$)"
              licence: MIT
              requires_notice: false
              evidence: "Alpine base image; the distro's own layers carry /usr/share/licenses."

            - match: "^python(:|@|$)"
              licence: PSF-2.0
              requires_notice: false
              evidence: >-
                Docker official `python` image (Debian/Alpine base). Interpreter and distro
                licence files ship in the image itself (/usr/share/doc, /usr/lib/python3*/LICENSE.txt).

            - match: "^golang(:|@|$)"
              licence: BSD-3-Clause
              requires_notice: false
              evidence: "Docker official `golang` image; /usr/local/go/LICENSE ships in the image."

            - match: "^ghcr\\.io/astral-sh/uv(:|@|$)"
              licence: MIT OR Apache-2.0
              requires_notice: false
              evidence: >-
                astral-sh/uv is dual-licensed MIT OR Apache-2.0; taken under MIT, whose
                condition is satisfied by the licence files in the image's own layers. Only
                used as a BUILDER stage in the fleet, so it is not a final-stage base today.

          # ── Waivers ──────────────────────────────────────────────────────────────────
          #
          # Same contract as k3s-01/image-pin-policy.yaml, for the same reason: a gate
          # whose exceptions are hardcoded in the script is a gate whose exceptions are
          # invisible and permanent.
          #
          #   dockerfile  exact path, either `<repo-dir>/<path>` or the repo-relative
          #               path on its own (so the same waiver works in a fleet run and in
          #               a single-repo CI checkout).
          #   rule        the exact detection being waived. A waiver can never suppress a
          #               DIFFERENT finding that later appears in the same file.
          #   reason      mandatory, and it has to say why the fix is not being made now.
          #   expires     mandatory and ENFORCED. Past its date the waiver stops
          #               suppressing and the finding is live, so the debt cannot renew
          #               itself by being ignored. Every applied waiver prints as WAIVED
          #               on every run; one that matches nothing FAILS the check, so a
          #               waiver cannot outlive the problem it covers.
          #
          # Seeded 2026-08-22, when the gate was first wired.
          waivers:
            - dockerfile: "k3s-01/kubernetes/workloads/home/mlflow/image/Dockerfile"
              rule: notice-propagating-base
              reason: >-
                Real finding, not a false positive: the image is built from Apache-2.0
                mlflow and pushed to nexus-docker.infra.plexplease.com, so §4(a) binds this
                build and no licence text is added by the Dockerfile. Waived only because
                k3s-01 is owned by another workstream and E7.T26 may not modify it. The fix
                is one line in the final stage — copy the Apache-2.0 text (and mlflow's
                copyright line) to /usr/share/licenses/mlflow/. Remove this waiver with that
                commit.
              expires: "2026-09-30"
          INLINE_EOF
      # <<< INLINE /tmp/container-notice-policy.yaml <<<

      # ── §1.6 Documentation minimalism ───────────────────────────────────────
      - name: "Gate — documentation minimalism (§1.6)"
        run: |
          ARGS=""
          false && ARGS="--exempt-vendored"
          python3 /tmp/check-doc-minimalism.py . $ARGS

      # ── §1.6 baseline ratchet ───────────────────────────────────────────────
      # The gate above only blocks markdown that is NOT in .doc-minimalism-baseline.
      # Without this step the baseline is permanent amnesty: green forever while
      # the debt never shrinks. This step enforces that the baseline is dated,
      # cannot gain an entry, and self-cleans as files are migrated.
      # Reuses the checker inlined above — no second copy to drift.
      - name: "Gate — documentation minimalism baseline ratchet (§1.6)"
        env:
          # On pull_request the base commit is the ratchet reference; on push
          # there is none and the checker falls back to HEAD, which still
          # enforces expiry, self-clean and the burn-down schedule.
          DOC_MINIMALISM_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ARGS=""
          false && ARGS="--exempt-vendored"
          python3 /tmp/check-doc-minimalism.py . --ratchet $ARGS

      # ── Licensing-Policy §3: container builds carry the notices they owe ────
      #
      # E7.T26. A container image is a redistribution, so when a build here bakes
      # upstream code into an image and pushes it, the licence's notice condition
      # binds US. A grep for licence/notice/copyright across every Dockerfile in
      # the fleet returned ZERO matches while two of those builds were shipping
      # upstream MIT code to Nexus.
      #
      # Skipped entirely when the caller has no Dockerfile, so repos that build no
      # images pay nothing. Both the checker AND its base-image classification are
      # inlined above — the config is not optional decoration: without it the
      # check classifies nothing and passes everything.
      - name: "Gate — container notice obligations (Licensing-Policy §3)"
        run: |
          if ! find . -path ./.git -prune -o \
                 \( -name 'Dockerfile' -o -name 'Dockerfile.*' -o -name '*.Dockerfile' \
                    -o -name 'Containerfile' \) -print | grep -q .; then
            echo "no Dockerfile in this repository - nothing to check"
            exit 0
          fi
          pip install --quiet pyyaml
          python3 /tmp/check-container-notices.py . --config /tmp/container-notice-policy.yaml

      # ── AGENTS.md provenance ────────────────────────────────────────────────
      # Full drift detection needs the vault, which GitHub-hosted runners cannot
      # reach (private repo, no token wired up). Local pre-commit runs the real
      # `render-agents-md.py --check`. CI verifies the weaker invariant: that the
      # file is still generated and nobody replaced it with a hand-written copy.
      - name: "Gate — AGENTS.md is generated"
        run: |
          if [ ! -f AGENTS.md ]; then
            echo "::error::AGENTS.md is missing. Generate it: render-agents-md.py --repo . --profile <profile>"
            exit 1
          fi
          if ! grep -q "BEGIN GENERATED" AGENTS.md || ! grep -q "END GENERATED" AGENTS.md; then
            echo "::error::AGENTS.md has lost its generation markers — it was hand-edited or replaced."
            echo "::error::Regenerate from the vault: render-agents-md.py --repo . --profile <profile>"
            exit 1
          fi
          echo "ok: AGENTS.md carries generation markers"
