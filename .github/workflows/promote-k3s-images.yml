name: Promote k3s-01 image pins

# After app images are pushed to Nexus with immutable :${GIT_SHA} (or digests),
# this workflow:
#   1. Resolves cliproxy to an immutable digest (required — issue #415 / epic #413)
#   2. Runs staging deep-smoke --full (CI promote gate — issue #410 / epic #396)
#   3. Opens a one-commit PR on echoares-lab/k3s-01 updating the ai-gateway
#      overlay `images:` pins so ArgoCD rolls out to production
#
# Triggers:
#   - workflow_run after CI Suite push to main (gateway-engine SHA + cliproxy candidate)
#   - repository_dispatch type cliproxy-candidate-ready from CLIProxyAPI Nexus CI
#   - workflow_dispatch for manual / emergency promotion
#
# Requires repository secrets:
#   K3S_GITOPS_TOKEN or GH_PAT_AUTO_APPROVE — contents:write + pull-requests:write on k3s-01
#   DEEP_SMOKE_STAGING_API_KEY, K3S_KUBECONFIG — see staging-deep-smoke.yml
#   CLIPROXY_CANDIDATE_TAG — immutable Nexus tag for auto promote (not latest/dev)
#   NEXUS_USERNAME, NEXUS_PASSWORD — registry manifest lookup for cliproxy digest
# Optional: DEEP_SMOKE_STAGING_ADMIN_KEY
#
# Emergency: workflow_dispatch input skip_deep_smoke=true skips the staging gate
# (auto path from CI Suite never skips).

on:
  workflow_dispatch:
    inputs:
      gateway_engine:
        description: "gateway-engine image tag (full git sha) or sha256 digest"
        required: false
        type: string
      gateway_version:
        description: "gateway-engine SemVer label (defaults to repository VERSION)"
        required: false
        type: string
      credential_prober:
        description: "credential-prober tag or sha256 digest"
        required: false
        type: string
      docs_server:
        description: "docs-server tag or sha256 digest"
        required: false
        type: string
      cliproxy:
        description: "cli-proxy-api immutable candidate tag or sha256 digest (required unless cliproxy_digest set)"
        required: false
        type: string
      cliproxy_digest:
        description: "Pre-resolved cli-proxy-api sha256 digest (skips registry lookup)"
        required: false
        type: string
      git_sha:
        description: "If set, promote gateway-engine/credential-prober/docs-server to this full sha"
        required: false
        type: string
      skip_deep_smoke:
        description: "Emergency only: skip staging deep-smoke --full before promote"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [cliproxy-candidate-ready]
  workflow_run:
    workflows: ["CI Suite"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  resolve-sha:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: arc
    outputs:
      expect_git_sha: ${{ steps.sha.outputs.expect_git_sha }}
      skip_deep_smoke: ${{ steps.sha.outputs.skip_deep_smoke }}
    steps:
      - name: Resolve candidate SHA / skip flag
        id: sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_GIT_SHA: ${{ inputs.git_sha }}
          INPUT_SKIP: ${{ inputs.skip_deep_smoke }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_GIT_SHA: ${{ github.event.client_payload.git_sha }}
        run: |
          set -euo pipefail
          SHA=""
          if [[ -n "${INPUT_GIT_SHA:-}" ]]; then
            SHA="${INPUT_GIT_SHA}"
          elif [[ "${EVENT_NAME}" == "repository_dispatch" && -n "${DISPATCH_GIT_SHA:-}" ]]; then
            SHA="${DISPATCH_GIT_SHA}"
          elif [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            SHA="${RUN_HEAD_SHA}"
          fi
          echo "expect_git_sha=${SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${INPUT_SKIP}" == "true" ]]; then
            echo "skip_deep_smoke=true" >> "$GITHUB_OUTPUT"
            echo "::warning::skip_deep_smoke=true — staging deep-smoke gate bypassed (emergency dispatch only)."
          else
            echo "skip_deep_smoke=false" >> "$GITHUB_OUTPUT"
          fi

  bump-staging:
    needs: resolve-sha
    if: >
      needs.resolve-sha.outputs.skip_deep_smoke != 'true' &&
      needs.resolve-sha.outputs.expect_git_sha != ''
    concurrency:
      group: bump-staging-k3s-01
      cancel-in-progress: false
    runs-on: arc
    steps:
      - name: Resolve token
        id: token
        env:
          PAT: ${{ secrets.K3S_GITOPS_TOKEN || secrets.GH_PAT_AUTO_APPROVE }}
        run: |
          if [[ -z "${PAT}" ]]; then
            echo "::error::Missing K3S_GITOPS_TOKEN or GH_PAT_AUTO_APPROVE secret; cannot bump k3s-01 staging pins."
            exit 1
          fi
          echo "token=${PAT}" >> "$GITHUB_OUTPUT"

      - name: Checkout ai-gateway (for promote script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Checkout k3s-01
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: echoares-lab/k3s-01
          ref: production
          path: k3s-01
          token: ${{ steps.token.outputs.token }}

      - name: Setup Python for mirror script
        uses: ./.github/actions/setup-python-venv
        with:
          extra-packages: pyyaml

      - name: Mirror external images to staging
        run: |
          set -euo pipefail
          .venv-ci/bin/python -m scripts.k3s.mirror_external_images --k3s-repo k3s-01

      - name: Install kubectl for Kustomize validation
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.34.1

      - name: Bump staging image pins and push
        id: bump
        env:
          GIT_SHA: ${{ needs.resolve-sha.outputs.expect_git_sha }}
        run: |
          set -euo pipefail
          python3 -m scripts.k3s.promote_k3s_images \
            --k3s-repo k3s-01 \
            --overlay kubernetes/workloads/home/ai-gateway/overlays/staging/kustomization.yaml \
            --gateway-engine "${GIT_SHA}" \
            --credential-prober "${GIT_SHA}" \
            --docs-server "${GIT_SHA}"
          kubectl kustomize k3s-01/kubernetes/workloads/home/ai-gateway/overlays/staging >/dev/null

          cd k3s-01
          if git diff --quiet; then
            echo "staging already pinned to ${GIT_SHA}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "ai-gateway-ci"
          git config user.email "ci@echoares-lab.invalid"
          git add kubernetes/workloads/home/ai-gateway/overlays/staging/
          git commit -m "chore(staging): bump ai-gateway image pins to ${GIT_SHA}"
          git push origin HEAD:production
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for ArgoCD sync and rollout
        if: steps.bump.outputs.changed == 'true'
        env:
          KUBECONFIG_DATA: ${{ secrets.K3S_KUBECONFIG }}
          GIT_SHA: ${{ needs.resolve-sha.outputs.expect_git_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${KUBECONFIG_DATA}" ]]; then
            echo "::warning::Missing K3S_KUBECONFIG; skipping rollout wait (staging-deep-smoke will still gate on git_sha)."
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBECONFIG_DATA" | grep -q 'apiVersion:'; then
            printf '%s' "$KUBECONFIG_DATA" >"$HOME/.kube/config"
          else
            printf '%s' "$KUBECONFIG_DATA" | base64 -d >"$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          for i in $(seq 1 30); do
            IMAGE=$(kubectl -n ai-gateway-staging get deploy gateway-engine -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            if [[ "$IMAGE" == *"${GIT_SHA}"* ]]; then
              break
            fi
            sleep 10
          done
          kubectl -n ai-gateway-staging rollout status deploy/gateway-engine --timeout=180s
          kubectl -n ai-gateway-staging rollout status deploy/credential-prober --timeout=180s
          kubectl -n ai-gateway-staging rollout status deploy/docs-server --timeout=180s

  staging-deep-smoke:
    needs: [resolve-sha, bump-staging]
    if: >
      always() &&
      needs.resolve-sha.outputs.skip_deep_smoke != 'true' &&
      (needs.bump-staging.result == 'success' || needs.bump-staging.result == 'skipped')
    uses: ./.github/workflows/staging-deep-smoke.yml
    secrets: inherit
    with:
      expect_git_sha: ${{ needs.resolve-sha.outputs.expect_git_sha }}

  promote:
    needs: [resolve-sha, staging-deep-smoke]
    if: >
      always() &&
      needs.resolve-sha.result == 'success' &&
      (needs.staging-deep-smoke.result == 'success' ||
       needs.staging-deep-smoke.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'repository_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: arc
    steps:
      - name: Resolve token
        id: token
        env:
          PAT: ${{ secrets.K3S_GITOPS_TOKEN || secrets.GH_PAT_AUTO_APPROVE }}
        run: |
          if [[ -z "${PAT}" ]]; then
            echo "::error::Missing K3S_GITOPS_TOKEN or GH_PAT_AUTO_APPROVE secret; cannot open k3s-01 promote PR."
            exit 1
          fi
          echo "token=${PAT}" >> "$GITHUB_OUTPUT"

      - name: Checkout ai-gateway (for promote script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve cliproxy candidate digest
        id: cliproxy
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CLIPROXY: ${{ inputs.cliproxy }}
          INPUT_CLIPROXY_DIGEST: ${{ inputs.cliproxy_digest }}
          DISPATCH_CLIPROXY_TAG: ${{ github.event.client_payload.cliproxy_tag }}
          DISPATCH_CLIPROXY_DIGEST: ${{ github.event.client_payload.cliproxy_digest }}
          CANDIDATE_TAG: ${{ secrets.CLIPROXY_CANDIDATE_TAG }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          REF=""
          if [[ -n "${INPUT_CLIPROXY_DIGEST:-}" ]]; then
            REF="${INPUT_CLIPROXY_DIGEST}"
          elif [[ -n "${INPUT_CLIPROXY:-}" ]]; then
            REF="${INPUT_CLIPROXY}"
          elif [[ "${EVENT_NAME}" == "repository_dispatch" ]]; then
            REF="${DISPATCH_CLIPROXY_DIGEST:-${DISPATCH_CLIPROXY_TAG:-}}"
          fi
          if [[ -z "${REF}" ]]; then
            REF="${CANDIDATE_TAG:-}"
          fi
          if [[ -z "${REF}" ]]; then
            echo "::error::cliproxy candidate is required (repository_dispatch payload, workflow input, or CLIPROXY_CANDIDATE_TAG secret)."
            exit 1
          fi
          DIGEST=$(python3 scripts/k3s/resolve_image_digest.py --reference "${REF}")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Resolved cliproxy candidate ${REF} -> ${DIGEST}"

      - name: Checkout k3s-01
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: echoares-lab/k3s-01
          ref: production
          path: k3s-01
          token: ${{ steps.token.outputs.token }}

      - name: Resolve image pins
        id: pins
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_GIT_SHA: ${{ inputs.git_sha }}
          INPUT_GE: ${{ inputs.gateway_engine }}
          INPUT_GATEWAY_VERSION: ${{ inputs.gateway_version }}
          INPUT_CP: ${{ inputs.credential_prober }}
          INPUT_DS: ${{ inputs.docs_server }}
          CLIPROXY_DIGEST: ${{ steps.cliproxy.outputs.digest }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_GIT_SHA: ${{ github.event.client_payload.git_sha }}
        run: |
          set -euo pipefail
          SHA=""
          if [[ -n "${INPUT_GIT_SHA}" ]]; then
            SHA="${INPUT_GIT_SHA}"
          elif [[ "${EVENT_NAME}" == "repository_dispatch" && -n "${DISPATCH_GIT_SHA:-}" ]]; then
            SHA="${DISPATCH_GIT_SHA}"
          elif [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            SHA="${RUN_HEAD_SHA}"
          fi

          GE="${INPUT_GE:-}"
          CP="${INPUT_CP:-}"
          DS="${INPUT_DS:-}"
          CLIPROXY="${CLIPROXY_DIGEST}"
          GATEWAY_VERSION="${INPUT_GATEWAY_VERSION:-$(tr -d '[:space:]' < VERSION)}"

          if [[ -n "${SHA}" ]]; then
            GE="${GE:-$SHA}"
            if [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_GIT_SHA}" ]]; then
              CP="${CP:-$SHA}"
              DS="${DS:-$SHA}"
            fi
          fi

          if [[ -z "${CLIPROXY}" ]]; then
            echo "::error::cliproxy digest is required for promotion."
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "workflow_run" && -z "${GE}" ]]; then
            echo "::error::gateway-engine pin is required on the CI Suite auto-promote path."
            exit 1
          fi

          echo "gateway_engine=${GE}" >> "$GITHUB_OUTPUT"
          echo "gateway_version=${GATEWAY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "credential_prober=${CP}" >> "$GITHUB_OUTPUT"
          echo "docs_server=${DS}" >> "$GITHUB_OUTPUT"
          echo "cliproxy=${CLIPROXY}" >> "$GITHUB_OUTPUT"
          if [[ -n "${SHA}" ]]; then
            BRANCH_SUFFIX="${SHA:0:7}"
          else
            BRANCH_SUFFIX="manual-$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "branch_suffix=${BRANCH_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "Promoting GE=${GE} VERSION=${GATEWAY_VERSION} CP=${CP} DS=${DS} CLIPROXY=${CLIPROXY}"

          # Extract staging pins and compare with production
          python3 - <<'EOF'
          import re
          import os
          from pathlib import Path

          def get_container_image(file_path: Path, container_name: str) -> str:
              if not file_path.is_file():
                  return ""
              content = file_path.read_text(encoding="utf-8")
              pattern = re.compile(
                  rf"-\s+name:\s*{re.escape(container_name)}\b(?:[ \t]*\n|[^-\n].*\n)*?[ \t]+image:\s*(?:>\-\s*\n[ \t]+)?([^\s\n]+)"
              )
              m = pattern.search(content)
              if m:
                  return m.group(1).strip()
              return ""

          def get_kustomize_image(file_path: Path, image_name: str) -> str:
              if not file_path.is_file():
                  return ""
              content = file_path.read_text(encoding="utf-8")
              pattern = re.compile(
                  rf"-\s+name:\s*{re.escape(image_name)}\b(?:[ \t]*\n|[^-\n].*\n)*?[ \t]+(?:newTag:\s*\"?([^\n\"]+)\"?|digest:\s*([^\n\s]+))"
              )
              m = pattern.search(content)
              if m:
                  val = m.group(1) or m.group(2)
                  return val.strip()
              return ""

          def parse_tag_or_digest(image_ref: str) -> str:
              if "@" in image_ref:
                  return image_ref.split("@")[-1]
              if ":" in image_ref:
                  return image_ref.split(":")[-1]
              return image_ref

          k3s_repo = Path("k3s-01")
          staging_dir = k3s_repo / "kubernetes/workloads/home/ai-gateway/overlays/staging"
          prod_dir = k3s_repo / "kubernetes/workloads/home/ai-gateway/overlays/k3s-01"

          # 1. LiteLLM (staging monolithic vs production split layout)
          stg_litellm = get_container_image(staging_dir / "core-workloads.yaml", "litellm")
          prod_litellm = get_container_image(prod_dir / "litellm" / "litellm.yaml", "litellm")
          if not prod_litellm:
              prod_litellm = get_container_image(prod_dir / "core-workloads.yaml", "litellm")

          # 2. Langfuse
          stg_langfuse_raw = get_container_image(staging_dir / "observability.yaml", "langfuse-web")
          stg_langfuse = parse_tag_or_digest(stg_langfuse_raw)
          prod_langfuse = get_kustomize_image(
              prod_dir / "langfuse" / "kustomization.yaml",
              "docker.io/langfuse/langfuse",
          )
          if not prod_langfuse:
              prod_langfuse = get_kustomize_image(prod_dir / "kustomization.yaml", "docker.io/langfuse/langfuse")

          # 3. Langfuse Worker
          stg_worker_raw = get_container_image(staging_dir / "observability.yaml", "langfuse-worker")
          stg_worker = parse_tag_or_digest(stg_worker_raw)
          prod_worker = get_kustomize_image(
              prod_dir / "langfuse" / "kustomization.yaml",
              "docker.io/langfuse/langfuse-worker",
          )
          if not prod_worker:
              prod_worker = get_kustomize_image(prod_dir / "kustomization.yaml", "docker.io/langfuse/langfuse-worker")

          litellm_val = stg_litellm if stg_litellm != prod_litellm else ""
          langfuse_val = stg_langfuse if stg_langfuse != prod_langfuse else ""
          worker_val = stg_worker if stg_worker != prod_worker else ""

          print(f"Staging LiteLLM: {stg_litellm} | Production LiteLLM: {prod_litellm} -> resolve: {litellm_val}")
          print(f"Staging Langfuse: {stg_langfuse} | Production Langfuse: {prod_langfuse} -> resolve: {langfuse_val}")
          print(f"Staging Worker: {stg_worker} | Production Worker: {prod_worker} -> resolve: {worker_val}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"litellm={litellm_val}\n")
              f.write(f"langfuse={langfuse_val}\n")
              f.write(f"langfuse_worker={worker_val}\n")
          EOF

      - name: Install kubectl for Kustomize validation
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.34.1

      - name: Apply pin updates
        run: |
          set -euo pipefail
          ARGS=(--k3s-repo k3s-01)
          GE='${{ steps.pins.outputs.gateway_engine }}'
          GATEWAY_VERSION='${{ steps.pins.outputs.gateway_version }}'
          CP='${{ steps.pins.outputs.credential_prober }}'
          DS='${{ steps.pins.outputs.docs_server }}'
          CLIPROXY='${{ steps.pins.outputs.cliproxy }}'
          LITELLM='${{ steps.pins.outputs.litellm }}'
          LANGFUSE='${{ steps.pins.outputs.langfuse }}'
          LANGFUSE_WORKER='${{ steps.pins.outputs.langfuse_worker }}'
          [[ -n "${GE}" ]] && ARGS+=(--gateway-engine "${GE}" --gateway-version "${GATEWAY_VERSION}")
          [[ -n "${CP}" ]] && ARGS+=(--credential-prober "${CP}")
          [[ -n "${DS}" ]] && ARGS+=(--docs-server "${DS}")
          ARGS+=(--cliproxy "${CLIPROXY}")
          [[ -n "${LITELLM}" ]] && ARGS+=(--litellm "${LITELLM}")
          [[ -n "${LANGFUSE}" ]] && ARGS+=(--langfuse "${LANGFUSE}")
          [[ -n "${LANGFUSE_WORKER}" ]] && ARGS+=(--langfuse-worker "${LANGFUSE_WORKER}")
          python3 -m scripts.k3s.promote_k3s_images "${ARGS[@]}"
          kubectl kustomize k3s-01/kubernetes/workloads/home/ai-gateway/overlays/k3s-01 >/dev/null

      - name: Install verified GitHub CLI for PR creation
        run: |
          set -euo pipefail
          GH_CLI_VERSION=2.46.0
          GH_CLI_SHA256=c671d450d7c0e95c84fbc6996591fc851d396848acd53e589ee388031cee9330
          ARCHIVE="gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/${ARCHIVE}" \
            -o "${RUNNER_TEMP}/${ARCHIVE}"
          echo "${GH_CLI_SHA256}  ${RUNNER_TEMP}/${ARCHIVE}" | sha256sum --check --status
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}"
          GH_BIN="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64/bin"
          echo "${GH_BIN}" >> "$GITHUB_PATH"
          PATH="${GH_BIN}:${PATH}" gh --version

      - name: Create promote PR on k3s-01
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DEEP_SMOKE_SKIPPED: ${{ needs.resolve-sha.outputs.skip_deep_smoke }}
          DEEP_SMOKE_SUMMARY: ${{ needs.staging-deep-smoke.outputs.summary }}
        run: |
          set -euo pipefail
          cd k3s-01
          if git diff --quiet; then
            echo "No pin changes (already up to date)."
            exit 0
          fi
          BRANCH="chore/promote-ai-gateway-images-${{ steps.pins.outputs.branch_suffix }}"
          git config user.name "ai-gateway-ci"
          git config user.email "ci@echoares-lab.invalid"
          git checkout -b "$BRANCH"
          git add kubernetes/workloads/home/ai-gateway/overlays/k3s-01/
          git commit -m "chore(ai-gateway): promote image and release metadata"
          git push -u origin "$BRANCH"

          SMOKE_NOTE="Staging deep-smoke --full: **passed** (CI promote gate #410)."
          if [[ "${DEEP_SMOKE_SKIPPED}" == "true" ]]; then
            SMOKE_NOTE="⚠️ Staging deep-smoke **skipped** via workflow_dispatch skip_deep_smoke=true."
          fi

          EXTRA_CHECKLIST=""
          LITELLM_PIN='${{ steps.pins.outputs.litellm }}'
          LANGFUSE_PIN='${{ steps.pins.outputs.langfuse }}'
          if [[ -n "${LITELLM_PIN}" ]]; then
            EXTRA_CHECKLIST+=$'\n### LiteLLM promotion checklist\n'
            EXTRA_CHECKLIST+=$'- [ ] **Prisma migration review:** read release notes; inspect `litellm-migrate` job / Prisma migrations in the new image.\n'
            EXTRA_CHECKLIST+=$'- [ ] If migrations are not backward-compatible, confirm DB backup is planned/executed before merge.\n'
            EXTRA_CHECKLIST+=$'- [ ] Confirm `litellm-migrate` Job succeeded on staging.\n'
          fi
          if [[ -n "${LANGFUSE_PIN}" ]]; then
            EXTRA_CHECKLIST+=$'\n### Langfuse promotion checklist\n'
            EXTRA_CHECKLIST+=$'- [ ] **Migration review:** check Langfuse release notes for Postgres/ClickHouse schema changes.\n'
            EXTRA_CHECKLIST+=$'- [ ] Trace ingestion + worker health verified (traces in Langfuse UI, worker logs clean).\n'
          fi

          gh pr create --repo echoares-lab/k3s-01 --base production --head "$BRANCH" \
            --title "chore(ai-gateway): promote immutable image pins" \
            --body "$(cat <<EOF
          ## Summary
          Automated image-pin promotion from ai-gateway CI (issues #361, #415).

          - gateway-engine: \`${{ steps.pins.outputs.gateway_engine }}\`
          - gateway version: \`${{ steps.pins.outputs.gateway_version }}\`
          - credential-prober: \`${{ steps.pins.outputs.credential_prober }}\`
          - docs-server: \`${{ steps.pins.outputs.docs_server }}\`
          - cliproxy (digest): \`${{ steps.pins.outputs.cliproxy }}\`
          $( [[ -n "${LITELLM_PIN}" ]] && echo "- litellm: \`\${LITELLM_PIN}\`" )
          $( [[ -n "${LANGFUSE_PIN}" ]] && echo "- langfuse: \`\${LANGFUSE_PIN}\`" )

          ## Staging deep-smoke (promote gate)
          \${SMOKE_NOTE}

          \`\`\`
          \${DEEP_SMOKE_SUMMARY:-"(no summary — skipped or empty)"}
          \`\`\`
          \${EXTRA_CHECKLIST}

          ## Test plan
          - [ ] \`kubectl kustomize kubernetes/workloads/home/ai-gateway/overlays/k3s-01\`
          - [ ] After merge, confirm ArgoCD sync and pod imageIDs
          - [ ] Thin prod Gate D / post-merge smoke after sync

