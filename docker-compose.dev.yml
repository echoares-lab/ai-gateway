networks:
  default: {}
volumes:
  dev_auth: null
  langfuse_postgres_data: null # Align with docker-compose.yml
  dev_cpa_data: null
  litellm_reconciliation_artifacts: null
services:
  postgres:
    container_name: TESTING-postgres-dev
    image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    volumes:
    - langfuse_postgres_data:/var/lib/postgresql/data
    - ./init-db-bootstrap.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    container_name: TESTING-redis-dev
    image: docker.io/redis:7@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
    restart: unless-stopped
    command: '--requirepass ${REDIS_AUTH:-myredissecret} --maxmemory-policy noeviction

      '
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --no-auth-warning
      - -a
      - ${REDIS_AUTH:-myredissecret}
      - ping
      interval: 3s
      timeout: 10s
      retries: 10
  cliproxy:
    container_name: TESTING-cliproxy-dev
    # Pulled from Nexus by default (CLIProxyAPI fork CI). To iterate on the fork locally,
    # use `./dev-env.sh rebuild-cliproxy <slot>`, which layers docker-compose.cliproxy-build.yml
    # to build from ${CLIPROXY_BUILD_CONTEXT:-/home/dev/repos/CLIProxyAPI}.
    image: ${CLIPROXY_IMAGE:-nexus-docker.infra.plexplease.com/cli-proxy-api:c305d49}
    command:
    - ./CLIProxyAPI
    - --config
    - /config/config.yaml
    restart: unless-stopped
    volumes:
    - ${CLIPROXY_DEV_CONFIG:-${HOME}/.cliproxy/config.yaml}:/config/config.yaml:ro
    - dev_auth:/home/dev/.cli-proxy-api
    environment:
      MANAGEMENT_PASSWORD: dev-management-key
    ports:
    - ${DEV_CLIPROXY_PORT:-8327}:8317
  litellm-migrate:
    container_name: TESTING-litellm-migrate-dev
    image: ghcr.io/berriai/litellm:v1.93.0@sha256:a1745e629abfb17d434426ff48b115f54f4f4c4a0f5af241de569e93c63c411e
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/litellm
    entrypoint:
    - prisma
    command:
    - migrate
    - deploy
    depends_on:
      postgres:
        condition: service_healthy
  gateway-migrate:
    container_name: TESTING-gateway-migrate-dev
    image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
    - ./db/migrations:/migrations:ro
    entrypoint:
    - /bin/bash
    - -ec
    - |
      shopt -s nullglob
      for f in /migrations/*.sql; do
        echo "Applying $$(basename "$$f")"
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d litellm -f "$$f"
      done
    depends_on:
      litellm-migrate:
        condition: service_completed_successfully
  litellm-config-init:
    container_name: TESTING-litellm-config-init-dev
    image: ghcr.io/berriai/litellm:v1.93.0@sha256:a1745e629abfb17d434426ff48b115f54f4f4c4a0f5af241de569e93c63c411e
    restart: "no"
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      if [ ! -f /config/litellm-config.yaml ]; then
        cp /seed/litellm-config.yaml /config/litellm-config.yaml
      fi
      chmod 0644 /config/litellm-config.yaml
    volumes:
    - ./litellm-config.yaml:/seed/litellm-config.yaml:ro
    - litellm_reconciliation_artifacts:/config
  litellm:
    container_name: TESTING-litellm-dev
    image: ghcr.io/berriai/litellm:v1.93.0@sha256:a1745e629abfb17d434426ff48b115f54f4f4c4a0f5af241de569e93c63c411e
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cliproxy:
        condition: service_started
      litellm-migrate:
        condition: service_completed_successfully
      gateway-migrate:
        condition: service_completed_successfully
      litellm-config-init:
        condition: service_completed_successfully
    environment:
      SKIP_MIGRATIONS: "true"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/litellm
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY}
      REDIS_AUTH: ${REDIS_AUTH:-myredissecret}
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
      DISABLE_CACHE: 'true'
    volumes:
    - litellm_reconciliation_artifacts:/config
    command:
    - --config
    - /config/litellm-config.yaml
    - --port
    - '4000'
    ports:
    - ${DEV_LITELLM_PORT:-4011}:4000
    healthcheck:
      test:
      - CMD-SHELL
      - "python -c 'import urllib.request, sys; r = urllib.request.urlopen(\"http://127.0.0.1:4000/health/readiness\", timeout=3); sys.exit(0 if 200 <= r.status < 300 else 1)'"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
  credential-prober:
    container_name: TESTING-credential-prober-dev
    image: ${DOCKER_REGISTRY:-nexus-docker.infra.plexplease.com/ai-gateway}/credential-prober:${GIT_SHA:-latest}
    build:
      context: ./services/credential-prober
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        ENVIRONMENT: ${ENVIRONMENT:-production}
    restart: unless-stopped
    environment:
    - CLIPROXY_URL=http://cliproxy:8317
    - CLIPROXY_MANAGEMENT_KEY=${CLIPROXY_MANAGEMENT_KEY:-cliproxy-mgmt-H6VXKpUCzmeDuHcGmH8Oqg}
    - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/litellm
    - GATEWAY_ENGINE_URL=${GATEWAY_ENGINE_URL:-http://gateway-engine:4000}
    depends_on:
      postgres:
        condition: service_healthy
      cliproxy:
        condition: service_started
      gateway-engine:
        condition: service_started
  gateway-engine:
    container_name: TESTING-gateway-engine-dev
    image: ${DOCKER_REGISTRY:-nexus-docker.infra.plexplease.com/ai-gateway}/gateway-engine:${GIT_SHA:-latest}
    build:
      context: ./services/gateway-engine
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        ENVIRONMENT: ${ENVIRONMENT:-production}
    command: uvicorn main:app --host 0.0.0.0 --port 4000 --reload
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      GATEWAY_ENGINE_ADMIN_KEY: ${GATEWAY_ENGINE_ADMIN_KEY}
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY}
      CLIPROXY_MANAGEMENT_KEY: ${CLIPROXY_MANAGEMENT_KEY:-}
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT:-30.0}
      LITELLM_CONFIG_PATH: /config/litellm-config.yaml
      DEV_SLOT: ${DEV_SLOT:-1}
      REDIS_URL: redis://:${REDIS_AUTH:-myredissecret}@redis:6379
      POLICY_ENGINE_ENABLED: ${POLICY_ENGINE_ENABLED:-false}
      POLICY_ENGINE_TIMEOUT_MS: ${POLICY_ENGINE_TIMEOUT_MS:-100}
    ports:
    - ${DEV_GATEWAY_ENGINE_PORT:-4010}:4000
    volumes:
    - ./services/gateway-engine:/app
    - litellm_reconciliation_artifacts:/config
  cpa-manager:
    container_name: TESTING-cpa-manager-dev
    image: seakee/cpa-manager:1.5.5@sha256:051bff237d8deb0cd6d9825e0c571ae8cd81f1aad91eb5ecf0dc253cf9a89731
    restart: unless-stopped
    depends_on:
    - cliproxy
    ports:
    - ${DEV_CPA_MANAGER_PORT:-18327}:18317
    environment:
      HTTP_ADDR: 0.0.0.0:18317
      USAGE_DB_PATH: /data/usage.sqlite
      USAGE_COLLECTOR_MODE: auto
    volumes:
    - dev_cpa_data:/data
