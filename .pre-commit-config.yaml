repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: validate-litellm-config
        name: Validate litellm-config.yaml
        entry: python3 -c "import yaml; yaml.safe_load(open('litellm-config.yaml'))"
        language: system
        files: litellm-config.yaml$
        pass_filenames: false

      - id: prevent-hardcoded-api-keys
        name: Prevent hardcoded API keys
        entry: bash .githooks/prevent-hardcoded-keys.sh
        language: system
        files: ^(litellm-config\.yaml|services/gateway-engine/main\.py|services/credential-prober/.*\.py|docker-compose\.yml|docker-compose\.dev\.yml)$
        pass_filenames: false

      - id: validate-yaml-syntax
        name: Validate YAML syntax in litellm-config.yaml
        entry: bash .githooks/validate-yaml.sh
        language: system
        files: litellm-config.yaml$
        pass_filenames: false

  # ── Master-Policy gates (added 2026-08-12) ─────────────────────────────
  # The AGENTS.md drift check lives here rather than in CI because it needs the
  # Obsidian vault, which GitHub-hosted runners cannot reach.
  - repo: local
    hooks:
      - id: doc-minimalism
        name: Master-Policy 1.6 documentation minimalism
        entry: python3 /home/dev/repos/dev-policies/tooling/scripts/check-doc-minimalism.py
        language: system
        pass_filenames: false
        always_run: true

      - id: agents-md-drift
        name: AGENTS.md matches the vault
        entry: bash -c 'python3 /home/dev/repos/dev-policies/tooling/scripts/render-agents-md.py --all --check'
        language: system
        pass_filenames: false
        always_run: true
